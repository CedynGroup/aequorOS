name: Set up CI MinIO
description: Start the pinned official MinIO binary with disposable SSE-KMS storage.
outputs:
  pid:
    description: Process to stop at the end of the job.
    value: ${{ steps.start.outputs.pid }}
runs:
  using: composite
  steps:
    - name: Cache the MinIO binary
      id: minio-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/aequoros-ci-minio/minio
        # The key namespace holds only the verified binary file (the path
        # above): an entry saved while the cache path was the whole runtime
        # directory must never be restored. Keyed by release, platform and the
        # pinned binary checksum; when the release CDN answers 504, the cache
        # restores the verified binary instead of failing every job of the run.
        key: minio-binary-${{ runner.os }}-${{ runner.arch }}-RELEASE.2025-09-07T16-13-09Z-7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
    - name: Download MinIO
      if: steps.minio-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        staging="$RUNNER_TEMP/aequoros-ci-minio-staging"
        mkdir -p "$staging"
        curl --fail --silent --show-error --location --retry 3 \
          https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z \
          --output "$staging/minio"
        # SHA256 from the official release's .sha256sum asset.
        echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  $staging/minio" | sha256sum --check --strict
        # Only a checksum-verified binary enters the cache path, so a failed
        # download can never save a partial file under the cache key.
        mkdir -p "$RUNNER_TEMP/aequoros-ci-minio"
        mv "$staging/minio" "$RUNNER_TEMP/aequoros-ci-minio/minio"
    - name: Verify and expose MinIO
      shell: bash
      run: |
        set -euo pipefail
        directory="$RUNNER_TEMP/aequoros-ci-minio"
        if [ ! -f "$directory/minio" ]; then
          echo "The MinIO binary is missing: neither the cache nor the download produced $directory/minio" >&2
          exit 1
        fi
        # Enforced on every run, cache hit or not.
        echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  $directory/minio" | sha256sum --check --strict
        chmod +x "$directory/minio"
        echo "$directory" >> "$GITHUB_PATH"
    - name: Start MinIO with built-in KMS
      id: start
      shell: bash
      env:
        MINIO_ROOT_USER: ciminio
        MINIO_ROOT_PASSWORD: ciminio123
      run: |
        set -euo pipefail
        directory="$RUNNER_TEMP/aequoros-ci-minio"
        mkdir -p "$directory/data" "$directory/certs"
        # The at-rest contract pins this key name; its material dies with the job.
        MINIO_KMS_SECRET_KEY="aequoros-key:$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
        export MINIO_KMS_SECRET_KEY
        "$directory/minio" --version
        nohup "$directory/minio" server "$directory/data" \
          --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
          --certs-dir "$directory/certs" \
          >"$directory/minio.log" 2>&1 </dev/null &
        pid=$!
        echo "pid=$pid" >> "$GITHUB_OUTPUT"
        for _ in $(seq 1 30); do
          if curl --fail --silent --max-time 2 http://127.0.0.1:9000/minio/health/live >/dev/null; then
            echo "MinIO is live"
            exit 0
          fi
          if ! kill -0 "$pid" 2>/dev/null; then break; fi
          sleep 1
        done
        cat "$directory/minio.log"
        kill "$pid" 2>/dev/null || true
        exit 1
