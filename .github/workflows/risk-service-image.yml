name: Risk Service Image

# Separate from the always-reported Risk service gate: registry availability
# must not determine whether lint and typecheck pass.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release
      - "release/**"
    # Match the Dockerfile's COPY inputs, plus build configuration. Backend
    # tests, docs and dashboard changes do not affect this production image.
    paths:
      - ".github/workflows/risk-service-image.yml"
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "backend/app/**"
      - "backend/alembic/**"
      - "backend/alembic.ini"
      - "backend/scripts/bootstrap_database.py"
      - "backend/scripts/database_roles_202610120096.sql"
      - "backend/scripts/database_roles_local.sql"

permissions:
  contents: read

jobs:
  build:
    name: Build production risk-service image
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials for public ECR pulls
        if: >-
          vars.AWS_ECR_PULL_ROLE_ARN != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' ||
          startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v'))
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PULL_ROLE_ARN }}
          aws-region: us-east-1
      - name: Log in to Amazon ECR Public
        if: >-
          vars.AWS_ECR_PULL_ROLE_ARN != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' ||
          startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v'))
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public
      - name: Build production risk-service image
        run: docker build --tag aequoros/risk-service:ci ./backend
