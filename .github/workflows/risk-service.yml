name: Risk Service CI

# Gate inventory (audit §1.4 / §5; D-32 re-measured 2026-08-22). Every job below
# fails the run when it fails — but read the BRANCH PROTECTION note at the bottom
# before reading "blocking" as "cannot merge".
#
# READ FIRST, because it reframes everything under it: backend CI on `main` ran
# NO test between 2026-08-03 and 2026-08-22, and it was TWO unrelated failures,
# not one. Measured from the run logs, not inferred:
#
#   2026-08-09  31342018468  failed at "Typecheck risk service"   (basedpyright)
#   2026-08-10  31346758336  failed at "Typecheck risk service"
#   2026-08-15  31852491835  failed at "Lint risk service"        (ruff)
#   2026-08-15  31901483657  failed at "Lint risk service"
#   2026-08-17  32023511387  failed at "Lint risk service"        (29 errors)
#   2026-08-21  32436868839  failed at "Install risk service dependencies"
#
# The first five are genuine source-quality failures: sync and lint ran, the
# gate worked, and each red run correctly stopped everything after it. Those are
# fixed in the tree, not here.
#
# The sixth is different in kind and is what this file now defends against.
# Commit `f33e869` moved `backend/mise.toml` to `backend/docs/mise.toml`. Every
# root task is a proxy into that file; with it gone each proxy re-resolved to
# itself and recursed 440 times in ~1 minute before the step failed. Nothing in
# the output said "missing file" — it read like a hang. Two additions close it:
# the `preflight` job below (stdlib Python, no mise, no uv, every other job
# needs it) and `backend/tests/architecture/test_ci_task_wiring.py`. The
# preflight is the one that matters, because the test is only reachable THROUGH
# a proxy — a guard that runs only when the thing it guards is healthy is not a
# guard.
#
#   preflight   — the mise task wiring, checked in stdlib Python with no mise
#                 and no uv, plus the change detection that replaced this
#                 workflow's `paths:` filter. Every other job needs it.
#   static      — lint and typecheck (ruff, basedpyright), the Backend
#                 Playwright contracts and the generated-client freshness check
#                 in ONE job, so a pull request pays the toolchain setup once.
#                 Each area keeps its own step, guarded with `if: always()` and
#                 by its own preflight output, so one failure cannot hide the
#                 others (image build: risk-service-image.yml)
#   architecture— Unit tests: database-free logic and architecture guards,
#                 explicit classification and connection/execution refusal
#   postgres-pool — the whole Postgres-backed scope on one pool of six
#                 duration-balanced shards: migration chain, RLS policies,
#                 schema defaults, row/advisory locks, and the integration and
#                 storage contracts. Each shard runs its tests/db slice
#                 serially, then the remaining scope with workers; pool
#                 sharding, selection and coverage guards are documented in
#                 backend/README.md#run-tests; parallel execution and schema
#                 isolation in backend/README.md#test-databases-and-the-primary-database.
#   postgres-locks — dedicated row-lock and advisory-lock coverage.
#   gate        — depends DIRECTLY on every real job (no chained summary jobs),
#                 verifies the pool's exact shard coverage and execution
#                 guards plus the aggregate cross-owner check, and aggregates
#                 every job into ONE always-reported context, so the suite can
#                 be made a required check. See BRANCH PROTECTION below.
#   real-data   — the DB-backed regulatory/attestation/auth/vendor API surface,
#                 plus BOTH run-parity proofs (tests/equivalence). 25 modules
#                 import `requires_real_data` (measured by AST import, not
#                 substring). It cannot run here and this is not a scheduling
#                 problem: tests/real_data.py pins REAL_ORG_ID/REAL_BANK_ID to
#                 identities that exist only on the primary database, so an
#                 ephemeral CI Postgres cannot satisfy it whatever secret is set.
#                 Neither the `REAL_DATA_CI_ENABLED` variable nor the
#                 `REAL_DATA_DATABASE_URL` secret exists on this repository
#                 (checked via the API), so the job is skipped by `if:` AND would
#                 skip every test if the `if:` passed. Closing it needs a network
#                 path from the runner to the primary and a read-only role —
#                 a founder/infra decision, deliberately not faked here.
#
# EVERY TEST GROUP ALSO PROVES IT RAN. pytest exits 0 when everything it collected
# skipped itself, which is how the storage contract sat at `27 passed, 18
# skipped` for months and how the concurrency tests ran in no environment at
# all. Postgres and storage suites write a JUnit report via PYTEST_ADDOPTS,
# and a following step asserts a floor of tests actually executed
# (.github/scripts/assert_pytest_ran.py or the gate's pool verifier).
# The unit owner's execution guard is documented in backend/README.md#run-tests.
# The lock job additionally allows ZERO skips, and so does the gate's pool
# verification for the schema/RLS and storage-contract modules, because the
# environment each stands up is supposed to satisfy its whole suite — and an
# RLS proof can abstain one test at a time (a role that bypasses RLS, a missing
# CREATEROLE), which a floor of "at least N ran" cannot see (audit A360-4). The
# pool verification sets no skip ceiling for the remaining integration tiers,
# because the opt-in tiers below legitimately skip there. Floors are set so
# that a whole test MODULE vanishing trips them: at least (collected − the
# largest module); recount when the suite changes shape.
#
# EXCLUDED from every job, with the reason — the honest complement of the list
# above. None of these is a scheduling oversight:
#   tests/live_data          — opt-in BY DESIGN. It reads the ACTUAL primary
#                              through a server-side read-only session, and
#                              pointing CI at production is the one thing this
#                              programme must not do. Skips cleanly with
#                              LIVE_DATA_DATABASE_URL unset (module-level
#                              skipif), so it costs the full-suite run nothing.
#   25 `requires_real_data`  — see the real-data job above.
#     modules
#   tests/data_engine/etl/test_training_on_data_integration.py — needs the untracked Sample Bank CSVs
#                              under backend/data/, deliberately not in the repo.
#   tests/scripts/test_dr_tooling.py DR-drill cases — need DR_DRILL_CLUSTER_URL,
#                              i.e. a disposable cluster the drill may destroy.
#   `ruff format --check .`  — not a gate anywhere; a tree-wide format pass has
#                              to land first. Named so a future format gate is
#                              not a surprise.
#
# MISE VERSION. `jdx/mise-action` installs the LATEST mise release when no
# `version:` is given (confirmed against the action's own input description), so
# the toolchain that resolves this repository's tasks could differ between two
# runs of the same commit. That is an unwanted variable underneath the only
# backend gate, and ruling it out cost real time while the 2026-08-21 outage was
# being diagnosed. Every job below pins 2026.7.7 — the version every task in
# this file was verified against locally, published 2026-07-15 with linux-x64
# assets. Bump it deliberately, in one commit, not by drift. The same rule pins
# `uv` in every `install_args` line and in `backend/mise.toml` `[tools]`: a
# `latest` there is one more network lookup per job and one more moving part
# under the gate; keep the two declarations on the same version.
#
# BRANCH PROTECTION — the part that decides whether any of this stops a merge.
# `main` required exactly ONE status check as of 2026-08-22 (`GET
# /repos/CedynGroup/aequorOS/branches/main/protection` -> `"contexts":
# ["gitleaks"]`, `enforce_admins: false`), which made every job here ADVISORY: a
# red run did not block a merge, and claude-review.yml's `gh pr merge --auto`
# hands the pull request to GitHub native auto-merge, which waits only on the
# REQUIRED checks.
#
# The reason the real gates could not simply be marked required is the trap this
# file used to sit in. A required check whose workflow is `paths:`-filtered NEVER
# REPORTS on a pull request touching none of those paths, and GitHub holds such a
# pull request at "Expected — waiting for status" forever: one docs-only or
# console-only pull request and the branch is unmergeable.
#
# THE REMEDY IMPLEMENTED HERE (2026-08-22): the `paths:` filter is gone from the
# trigger, so this workflow reports on every pull request, and the filtering
# moved one level down into `if:` conditions fed by the `preflight` job. Two
# short jobs — `preflight` and `gate` — therefore run on EVERY pull request; the
# expensive jobs use the separate input predicates in `preflight` below, and
# report `skipped` when irrelevant. `gate` aggregates them with `if: always()`
# and fails if any needed job failed or was cancelled, so it is a single,
# always-reported, honest context.
#
# THE TRADE-OFF, stated rather than buried: every pull request in the repository
# now pays for two ~30-second jobs it may not need, and a change-detection bug
# could in principle mis-skip a gate. That second risk is why
# .github/scripts/changed_area.sh answers "true" for anything it cannot
# determine — a non-pull_request event, an uncomputable diff, an empty change
# set. It can over-run gates; it must never silently under-run them. The
# alternative (a same-named companion job under the inverse condition) keeps the
# filters but needs the condition duplicated per workflow and inverted correctly
# by hand, which is a second thing to get wrong.
#
# CONTEXTS TO MARK REQUIRED once this lands — the aggregates, NOT the individual
# jobs (an individual job legitimately reports `skipped`, and a skipped required
# check is not a passing one):
#
#     gitleaks              (secret-scan.yml — already required)
#     Risk service gate     (this file)
#     Dashboard gate        (dashboard.yml)
#     Web gate              (web.yml)
#
# Those are the literal context strings. A status check's context is the JOB's
# name, not "Workflow / job" — the existing `gitleaks` entry is the job id of
# secret-scan.yml's only job, which is why it reads the way it does.
# Changing branch protection is a repository-settings change and deliberately
# not made here.

on:
  merge_group:
    types: [checks_requested]
  # No `paths:` filter, on purpose — see BRANCH PROTECTION above. The filtering
  # lives in the `if:` conditions on the expensive jobs, so that this workflow
  # always reports a status and can therefore be made a required check.
  pull_request:
  push:
    branches:
      - main
      - release
      - "release/**"

permissions:
  contents: read

# A gate that never gets a runner is as unenforced as a gate nobody wrote. This
# workflow has several jobs that stand up Postgres and run for tens of minutes,
# and the repository is worked by many concurrent branches — so without this
# every intermediate push kept a full matrix alive and the queue,
# not the tests, decided what ran. Superseded PR runs are cancelled; runs on
# `main` are never cancelled, because that is the history being recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/risk_service
  POSTGRES_TEST_URL: postgresql+psycopg://risk_service_test:risk_service_test@localhost:5432/risk_service

# See ARCHITECTURE.md §8, CI enforcement, for merge-queue execution policy
# and the verified issue #818 chronology.
jobs:
  # Runs on EVERY pull request, needs nothing, installs nothing, and every other
  # job depends on it. Two responsibilities, both cheap:
  #
  #   1. Prove the mise task wiring is intact. Backend CI is driven entirely
  #      through root tasks that proxy into backend/mise.toml; when that file
  #      moved in `f33e869` the proxies recursed 440 deep and the run failed
  #      having executed nothing, with no message naming the cause. The check is
  #      stdlib Python with no mise and no uv precisely so it still works when
  #      the thing it checks does not.
  #   2. Decide whether the expensive jobs are relevant to this pull request.
  #      This replaces the `paths:` filter that used to sit on the trigger and
  #      made every gate here impossible to require. See BRANCH PROTECTION above.
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.backend.outputs.backend }}
      guards: ${{ steps.guards.outputs.guards }}
      api_client: ${{ steps.api_client.outputs.api_client }}
      postgres_files: ${{ steps.postgres_plan.outputs.files }}
      postgres_matrix: ${{ steps.postgres_plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The change detector diffs against the base branch tip; a shallow
          # clone cannot see it.
          fetch-depth: 0
      - name: Verify the mise task wiring
        run: python3 .github/scripts/mise_wiring_preflight.py
      # Three areas, because the jobs read three different slices of the tree.
      # The Python suites read backend/ (the dashboard sources included: several
      # parity tests read them), so a root JavaScript lockfile-only or
      # generated-client-only change no longer costs a Postgres run. The
      # architecture guards also read EVERY workflow and CI script, so any
      # change under .github/ runs them. The client freshness check needs both.
      - name: Detect whether this pull request touches the risk service
        id: backend
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          .github/scripts/changed_area.sh backend
          '^(backend/|mise\.toml$|\.github/workflows/risk-service\.yml$|\.github/scripts/|\.github/actions/(setup-postgres|setup-minio|setup-openbao)/)'
      - name: Detect whether this pull request touches what the CI guards read
        id: guards
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          .github/scripts/changed_area.sh guards
          '^(backend/|mise\.toml$|\.github/)'
      - name: Detect whether this pull request touches the generated API client
        id: api_client
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          .github/scripts/changed_area.sh api_client
          '^(backend/|packages/risk-service-api/|mise\.toml$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.github/workflows/risk-service\.yml$|\.github/scripts/)'

      - name: Plan PostgreSQL shards and conservative affected tests
        id: postgres_plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 backend/scripts/ci_postgres.py plan

  static:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    needs: preflight
    # One job for the three cheap backend gates so a pull request pays the
    # toolchain setup once. The job runs when ANY of the three areas changed;
    # every gated step keeps its own `if: always()` guard so a red step cannot
    # hide the result of the others.
    if: (needs.preflight.outputs.backend == 'true' || needs.preflight.outputs.guards == 'true' || needs.preflight.outputs.api_client == 'true')
    # No job may outlive this. P0-15's outage was a task that recursed instead of
    # running anything; unbounded, GitHub would have let it burn the 360-minute
    # default. Values are ~3x the measured local wall clock, not tight. This job
    # now runs lint+typecheck, the backend e2e contracts and the client
    # freshness check serially, so its cap covers their combined measure.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          # Pinned — see MISE VERSION in the header. Bump deliberately.
          version: 2026.7.7
          install_args: python@3.13 uv@0.11.18 node@24 pnpm@11.2.2
      - name: Install risk service dependencies
        run: mise run risk-service:sync
      - name: Lint risk service
        if: always() && needs.preflight.outputs.backend == 'true'
        run: mise run risk-service:lint
      - name: Test TLS container environment policy
        if: always() && needs.preflight.outputs.backend == 'true'
        run: mise exec -- node --test deploy/tls/serve-next.test.cjs
      - name: Typecheck risk service
        if: always() && needs.preflight.outputs.backend == 'true'
        run: mise run risk-service:typecheck
      - name: Install workspace dependencies
        if: always() && (needs.preflight.outputs.guards == 'true' || needs.preflight.outputs.api_client == 'true')
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Run backend e2e contracts
        if: always() && needs.preflight.outputs.guards == 'true'
        env:
          CI_E2E_REPORT_DIR: ${{ runner.temp }}/e2e-tests
          CI_DATABASE_OBSERVATIONS: ${{ runner.temp }}/e2e-tests/database-observations
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/e2e-tests/report.xml
        working-directory: backend
        run: uv run pytest -m e2e --suite-only
      - name: Upload e2e execution and classification evidence
        if: always() && needs.preflight.outputs.guards == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-tests
          path: ${{ runner.temp }}/e2e-tests/
          if-no-files-found: error
      # Regenerates the schema and the TypeScript client and fails if either
      # moves. This existed only as a local pre-push hook, so a schema change
      # merged with a stale client whenever the hook was skipped.
      - name: Regenerate and verify the API client
        if: always() && needs.preflight.outputs.api_client == 'true'
        run: mise run risk-service:api-fresh

  architecture:
    name: Unit tests
    runs-on: ubuntu-24.04
    needs: preflight
    if: needs.preflight.outputs.guards == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.7.7
          install_args: python@3.13 uv@0.11.18
      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-uv-0.11.18-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-0.11.18-
      - name: Install risk service dependencies
        run: mise run risk-service:sync
      - name: Unit tests (database connections forbidden)
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          CI_UNIT_REPORT_DIR: ${{ runner.temp }}/unit-tests
          CI_DATABASE_OBSERVATIONS: ${{ runner.temp }}/unit-tests/database-observations
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/unit-tests/report.xml
        working-directory: backend
        run: uv run pytest -m unit --suite-only -n auto --dist load --durations=20
      - name: Collect the complete tree for cross-suite coverage
        working-directory: backend
        env:
          CASHFLOW_FAST_TEST: "1"
        run: uv run pytest --collect-only -q --collection-output="${{ runner.temp }}/unit-tests/all-tests.json"
      - name: Upload unit execution and classification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests
          path: ${{ runner.temp }}/unit-tests/
          if-no-files-found: error

  # One pool of Postgres-backed shards covering the schema/RLS suite (tests/db),
  # the integration suite and the storage contract. Every shard starts its own
  # PostgreSQL and MinIO; the shard owning the live-signing module starts
  # OpenBao. Membership comes from the committed duration baseline
  # (backend/scripts/ci_postgres_durations.json); exact coverage is verified by
  # the gate's pool verification.
  postgres-pool:
    name: Postgres tests shard ${{ matrix.shard }}/6
    runs-on: ubuntu-24.04
    needs: preflight
    if: needs.preflight.outputs.backend == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.postgres_matrix) }}
    services:
      # Answers the aws-kms envelope contracts of the storage suite. MinIO's
      # BUILT-IN KMS is enough for its server-side encryption — the KES sidecar
      # this appeared to need is not.
      bank-kms:
        image: nsmithuk/local-kms:3.11.7@sha256:360d7377b6f3687c89a622236791e4fa3f7316366267b437829edbdfa8a5fc60
        env:
          KMS_REGION: us-east-1
          KMS_ACCOUNT_ID: "111122223333"
        ports:
          - 18080:8080
    env:
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: ciminio
      S3_SECRET_KEY: ciminio123
      S3_BUCKET: risk-local
      S3_REGION: us-east-1
      # Ungates tests/attestation/service/test_attestation_openbao.py against native OpenBao
      # started below. Absent (a developer's machine), those tests skip and the
      # rest of the suite is unaffected.
      OPENBAO_TEST_ADDR: http://127.0.0.1:8200
      OPENBAO_TEST_TOKEN: aequoros-ci-root
      # STORAGE_RETIRE_AFTER is REQUIRED: enforce_retirement refuses to build a
      # client for env=mvp without one, so every storage contract test errors in
      # its fixture without it. test_storage_config.py clears the name itself,
      # so setting it here is safe. The date is CI-local and deliberately far
      # out — this job proves the storage contract, not the retirement policy.
      STORAGE_BACKEND: minio
      STORAGE_ENV: mvp
      STORAGE_RETIRE_AFTER: "2099-01-01"
      STORAGE_KMS_KEY_ID: aequoros-key
      TEST_KMS_ENDPOINT_URL: http://127.0.0.1:18080
    steps:
      - uses: actions/checkout@v4
      - name: Set up PostgreSQL
        uses: ./.github/actions/setup-postgres
      - uses: jdx/mise-action@v5
        with:
          # Pinned — see MISE VERSION in the header. Bump deliberately.
          version: 2026.7.7
          install_args: python@3.13 uv@0.11.18 node@24 pnpm@11.2.2
      - name: Install risk service dependencies
        run: mise run risk-service:sync
      # NOBYPASSRLS on purpose, and this is a HARD REQUIREMENT, not hygiene: the
      # migration chain and the RLS policies must be exercised without a
      # superuser bypass. Owner membership below is test infrastructure. A superuser here
      # hides exactly the class of defect audit finding P0-18 is about — and it
      # does not hide it quietly in one direction only. Measured 2026-08-22, the
      # same `tests/db` against two roles:
      #   * as the `postgres` SUPERUSER — 5 failures, every one an RLS-isolation
      #     assertion, because the superuser bypasses the policy and the "other
      #     tenant's rows are invisible" checks see them;
      #   * as this NOBYPASSRLS role — 0 RLS failures; all of
      #     tests/db/test_tenant_rls_completeness_integration.py and
      #     tests/db/test_governance_append_only_integration.py pass.
      # So a superuser does not merely weaken the gate, it INVERTS it: the tests
      # that exist to prove tenant isolation are the ones that go red, which
      # invites "fix" by relaxing the assertion. Never point this job at a
      # superuser connection, and never at the primary.
      # CREATEROLE: the schema suite provisions disposable roles directly. Test
      # infrastructure may create isolated roles and administer objects via
      # the NOLOGIN owner. It is not an application credential. Real application
      # role behavior is checked using independent, unprivileged logins.
      - name: Create restricted test role
        env:
          PGPASSWORD: postgres
        run: |
          psql --host localhost --username postgres --dbname risk_service --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE risk_service_test
            LOGIN PASSWORD 'risk_service_test'
            NOSUPERUSER NOCREATEDB CREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT CONNECT, CREATE, TEMPORARY ON DATABASE risk_service TO risk_service_test;
          GRANT aqs_owner TO risk_service_test WITH ADMIN TRUE, INHERIT TRUE, SET TRUE;
          GRANT aequoros_audit_owner TO risk_service_test WITH ADMIN TRUE, INHERIT TRUE, SET TRUE;
          SQL
      - name: Start MinIO for document and storage contracts
        id: minio
        uses: ./.github/actions/setup-minio
      - name: Create document test bucket
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import os
          import boto3

          client = boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT"],
              aws_access_key_id=os.environ["S3_ACCESS_KEY"],
              aws_secret_access_key=os.environ["S3_SECRET_KEY"],
              region_name=os.environ["S3_REGION"],
          )
          client.create_bucket(Bucket=os.environ["S3_BUCKET"])
          PY
      - name: Start OpenBao
        id: openbao
        if: matrix.openbao
        uses: ./.github/actions/setup-openbao
      - name: Postgres-backed suite on one shard
        env:
          TEST_DATABASE_URL: ${{ env.POSTGRES_TEST_URL }}
          POSTGRES_PRIVILEGE_TESTS_REQUIRED: "1"
          CI_POSTGRES_SHARD: ${{ matrix.shard }}
          CI_POSTGRES_FILES: ${{ needs.preflight.outputs.postgres_files }}
          CI_POSTGRES_REPORT_DIR: ${{ runner.temp }}/pg-pool
          CI_DATABASE_OBSERVATIONS: ${{ runner.temp }}/pg-pool/database-observations
          PYTEST_ADDOPTS: -p scripts.ci_postgres_plugin --junitxml=${{ runner.temp }}/pg-pool/report.xml
        working-directory: backend
        run: uv run python scripts/local_services.py run --postgres --storage --role-admin -- uv run pytest -m integration -n 4 --dist loadfile --ignore=tests/case/api/test_calculations_integration.py --ignore=tests/case/api/test_liquidity_integration.py --ignore=tests/case/api/test_scenarios_integration.py --ignore=tests/storage/test_key_rotation_concurrency_integration.py
      - name: Upload failed pool shard PostgreSQL log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pg-pool-server-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/postgres.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload pool shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-pool-${{ matrix.shard }}
          path: ${{ runner.temp }}/pg-pool/
          if-no-files-found: error
          retention-days: 7
      - name: Stop OpenBao
        if: always() && steps.openbao.outputs.pid != ''
        env:
          SERVICE_PID: ${{ steps.openbao.outputs.pid }}
        run: kill "$SERVICE_PID" 2>/dev/null || true
      - name: Stop MinIO
        if: always() && steps.minio.outputs.pid != ''
        env:
          SERVICE_PID: ${{ steps.minio.outputs.pid }}
        run: kill "$SERVICE_PID" 2>/dev/null || true

  postgres-locks:
    name: Postgres concurrency locks
    runs-on: ubuntu-24.04
    needs: preflight
    if: needs.preflight.outputs.backend == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up PostgreSQL
        uses: ./.github/actions/setup-postgres
      - uses: jdx/mise-action@v5
        with:
          # Pinned — see MISE VERSION in the header. Bump deliberately.
          version: 2026.7.7
          install_args: python@3.13 uv@0.11.18 node@24 pnpm@11.2.2
      - name: Install risk service dependencies
        run: mise run risk-service:sync
      - name: Create restricted lock test role
        env:
          PGPASSWORD: postgres
        run: |
          psql --host localhost --username postgres --dbname risk_service --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE risk_service_test
            LOGIN PASSWORD 'risk_service_test'
            NOSUPERUSER NOCREATEDB CREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT CONNECT, CREATE, TEMPORARY ON DATABASE risk_service TO risk_service_test;
          GRANT aqs_owner TO risk_service_test WITH ADMIN TRUE, INHERIT TRUE, SET TRUE;
          GRANT aequoros_audit_owner TO risk_service_test WITH ADMIN TRUE, INHERIT TRUE, SET TRUE;
          SQL
      # Dedicated row-lock and advisory-lock coverage. SQLite cannot exercise
      # these semantics; this step keeps failures distinct from the full
      # Postgres suite below.
      - name: Test Postgres concurrency locks
        env:
          TEST_DATABASE_URL: ${{ env.POSTGRES_TEST_URL }}
          CI_DATABASE_OBSERVATIONS: ${{ runner.temp }}/pg-locks/database-observations
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/pg-locks/report.xml
        working-directory: backend
        run: uv run python scripts/local_services.py run --postgres -- uv run pytest -m integration tests/case/api/test_liquidity_integration.py tests/case/api/test_scenarios_integration.py tests/case/api/test_calculations_integration.py tests/storage/test_key_rotation_concurrency_integration.py
      # Retain the execution floor and require zero skips for the lock owner.
      # The gate's verification also checks exact cross-owner coverage;
      # ownership and service requirements: backend/README.md#run-tests.
      - name: The concurrency tests must have executed, not skipped
        run: python3 .github/scripts/assert_pytest_ran.py "$RUNNER_TEMP/pg-locks/report.xml" --min-executed 60 --max-skipped 0
      - name: Upload lock integration execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-locks
          path: ${{ runner.temp }}/pg-locks/
          if-no-files-found: error

  real-data:
    name: Real-data API surface
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Skipped until a reachable primary-database URL is configured. Documented
    # rather than deleted: this is the only gate that covers the regulatory
    # return, attestation workspace, authentication and vendor-connection APIs.
    needs: preflight
    if: ${{ github.event_name != 'merge_group' && vars.REAL_DATA_CI_ENABLED == 'true' && needs.preflight.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          # Pinned — see MISE VERSION in the header. Bump deliberately.
          version: 2026.7.7
          install_args: python@3.13 uv@0.11.18 node@24 pnpm@11.2.2
      - name: Install risk service dependencies
        run: mise run risk-service:sync
      - name: Real-data API suite
        env:
          REAL_DATA_DATABASE_URL: ${{ secrets.REAL_DATA_DATABASE_URL }}
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/real-data.xml
        working-directory: backend
        run: uv run pytest tests/market_data tests/api tests/data_engine tests/equivalence tests/features tests/identity tests/icaap tests/irrbb tests/liquidity tests/fx tests/ftp tests/forecasting tests/reporting tests/attestation tests/bi tests/live tests/services
      # Every test in this tier self-skips when REAL_DATA_DATABASE_URL does not
      # resolve, so switching `REAL_DATA_CI_ENABLED` on with a URL that cannot
      # reach the primary would produce a green job covering nothing — the exact
      # illusion this gate is supposed to dispel. It has to execute or say so.
      - name: The real-data suite must have executed, not skipped
        run: python3 .github/scripts/assert_pytest_ran.py "$RUNNER_TEMP/real-data.xml"

  # The single context to mark required. Every job above can legitimately report
  # `skipped` — because this pull request does not touch its inputs, or because
  # `REAL_DATA_CI_ENABLED` is unset — and a skipped required check is NOT a
  # passing one: GitHub waits on it forever. This job always runs, always
  # reports, and is red if and only if something it depends on actually failed
  # or was cancelled. It depends directly on every real job — there are no
  # intermediate summary hops to hide a failure two levels deep — and it owns
  # the pool-coverage verifications and the cross-owner check.
  gate:
    name: Risk service gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    needs:
      - preflight
      - static
      - architecture
      - postgres-pool
      - postgres-locks
      - real-data
    steps:
      # Failure messages name every job that did not pass, with its result, so
      # a red run is diagnosed from the gate alone.
      - name: Report every gate job that did not pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          NOT_PASSED="$(printf '%s\n' "$RESULTS" \
            | jq -r 'to_entries[] | select(.value.result != "success") | "  \(.key): \(.value.result)"')"
          if [ -n "$NOT_PASSED" ]; then
            printf 'Gate jobs that did not pass:\n%s\n' "$NOT_PASSED"
          fi
          FAILED="$(printf '%s\n' "$RESULTS" \
            | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')"
          if [ -n "$FAILED" ]; then
            echo "::error::These risk service gates did not pass:${NOT_PASSED//$'\n'/%0A}"
            exit 1
          fi
          if [ -z "$NOT_PASSED" ]; then
            echo "Every risk service gate job passed."
          fi
      - uses: actions/checkout@v4
        if: needs.preflight.outputs.backend == 'true'
      - uses: actions/download-artifact@v8
        if: needs.preflight.outputs.backend == 'true'
        with:
          pattern: pg-pool-*
          path: ${{ runner.temp }}/postgres-reports
      - name: Verify exact pool coverage and execution guards
        if: needs.preflight.outputs.backend == 'true'
        env:
          CI_POSTGRES_FILES: ${{ needs.preflight.outputs.postgres_files }}
        run: python3 backend/scripts/ci_postgres.py verify "$RUNNER_TEMP/postgres-reports"
      - uses: actions/download-artifact@v8
        if: needs.preflight.outputs.backend == 'true'
        with:
          name: unit-tests
          path: ${{ runner.temp }}/postgres-reports/unit-tests
      - uses: actions/download-artifact@v8
        if: needs.preflight.outputs.backend == 'true'
        with:
          name: e2e-tests
          path: ${{ runner.temp }}/postgres-reports/e2e-tests
      - uses: actions/download-artifact@v8
        if: needs.preflight.outputs.backend == 'true'
        with:
          name: pg-locks
          path: ${{ runner.temp }}/postgres-reports/pg-locks
      - name: Every classified test has exactly one CI execution owner
        if: needs.preflight.outputs.backend == 'true'
        env:
          CI_POSTGRES_FILES: ${{ needs.preflight.outputs.postgres_files }}
        run: |
          python3 backend/scripts/test_suites.py "$RUNNER_TEMP/postgres-reports"
          python3 backend/scripts/database_observation_check.py "$RUNNER_TEMP/postgres-reports"
