name: Risk Service CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "packages/risk-service-api/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/risk-service.yml"
  push:
    branches:
      - main

jobs:
  risk-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: risk_service
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d risk_service"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The attestation signing backend. Without a real server the OpenBao tests
      # skip themselves, and "written but never executed" is exactly the state
      # the PKCS#11 backend is in — so CI runs one. Dev mode is unsealed with a
      # known root token, which is what the suite provisions its AppRole with;
      # it is in-memory and dies with the job.
      openbao:
        image: openbao/openbao:2.6.1
        env:
          BAO_DEV_ROOT_TOKEN_ID: aequoros-ci-root
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
          BAO_ADDR: http://127.0.0.1:8200
        ports:
          - "8200:8200"
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "bao status -address=http://127.0.0.1:8200 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Ungates tests/services/test_attestation_openbao.py against the service
      # container above. Absent (a developer's machine), those tests skip and the
      # rest of the suite is unaffected.
      OPENBAO_TEST_ADDR: http://127.0.0.1:8200
      OPENBAO_TEST_TOKEN: aequoros-ci-root
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install_args: python@3.13 uv@latest node@24 pnpm@11.2.2
      - name: Install risk service dependencies
        run: mise run risk-service:sync
      - name: Install workspace dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Lint risk service
        run: mise run risk-service:lint
      - name: Typecheck risk service
        run: mise run risk-service:typecheck
      - name: Test risk service
        run: mise run risk-service:test
      - name: Create restricted migration test role
        env:
          PGPASSWORD: postgres
        run: |
          psql --host localhost --username postgres --dbname risk_service --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE risk_service_test
            LOGIN PASSWORD 'risk_service_test'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT CONNECT, CREATE, TEMPORARY ON DATABASE risk_service TO risk_service_test;
          SQL
      - name: Test Postgres migrations
        env:
          TEST_DATABASE_URL: postgresql+psycopg://risk_service_test:risk_service_test@localhost:5432/risk_service
        run: mise run risk-service:test-postgres-migrations

      # Row-lock and advisory-lock coverage. Without this step the tests run
      # nowhere: SQLite skips them on the hermetic run above, and CI previously
      # gave a Postgres URL only to the migrations step.
      - name: Test Postgres concurrency locks
        env:
          TEST_DATABASE_URL: postgresql+psycopg://risk_service_test:risk_service_test@localhost:5432/risk_service
        run: mise run risk-service:test-postgres-locks
      - name: Typecheck generated API client
        run: mise run risk-service:api-typecheck
