name: Dashboard CI

# Gate inventory. Everything below is BLOCKING:
#
#   typecheck (client) — the generated API client compiles
#   test (client) — packages/risk-service-api/tests/generated-contracts.test.ts.
#                CLAUDE.md and packages/risk-service-api/README.md both name
#                `pnpm --filter @aequoros/risk-service-api test` as a required
#                verification step, and it appeared in NO workflow until
#                2026-08-22: CI ran `tsc --noEmit` only, so the contract
#                assertions the client is regenerated against had never been
#                enforced anywhere.
#   typecheck (dashboard) — the product surface compiles against it
#   lint       — ESLint (next/core-web-vitals). Added 2026-08-22; it had never
#                run in CI, and the tree carried one committed
#                react/no-unescaped-entities error, fixed in the same change so
#                this can be a gate rather than a warning nobody reads.
#   test       — isolated Node suites + Vitest behavior suites and coverage.
#                The legacy suites are CONTROLS, not unit trivia, and were
#                the reason this job existed at all without enforcing them:
#                  * lib/api/fail-open-guard.test.ts — a static guard over 374
#                    regulatory UI files proving no regulatory surface fails
#                    OPEN. The test reports the count itself and floor-asserts it
#                    at 300. Every count written here has gone stale ("123", then
#                    "220"), so treat the number as indicative and the test as
#                    authoritative.
#                    It gained a real NEGATIVE CONTROL on 2026-09-27 (audit
#                    A8-10): this comment claimed one for months while the only
#                    assertion was the file count, so a regex that silently
#                    stopped matching would have printed "N regulatory UI files
#                    clean" forever — which is what this guard's own history
#                    records happening three times. Each of the six rules must
#                    now convict a known violation of itself, a rule without such
#                    a proof fails, and the proofs are checked against innocent
#                    code so a rule cannot pass by matching everything;
#                  * lib/outbound.test.ts + lib/ip-version.test.ts — the SSRF
#                    egress guard, including a 60,000-case differential test
#                    against node:net.
#                Both are described as load-bearing in the audit's security and
#                production-readiness sections; neither was enforced anywhere.
#   build      — production Next build + Command Center entry-graph guard
#                (Recharts must remain deferred from the home route)
#
# Browser journeys have their own automatic, sharded workflow and required
# context: `Dashboard journeys gate`. See dashboard-journeys.yml and the
# dashboard README for disposable fixture isolation and manual dispatch.

# REQUIRED-CHECK SAFETY (2026-08-22). This workflow used to be `paths:`-filtered
# on both triggers, which makes it impossible to mark required: a required check
# whose workflow is path-filtered never REPORTS on a pull request touching none
# of those paths, and GitHub then holds that pull request at "Expected — waiting
# for status" forever. The filter therefore moved off the trigger and into an
# `if:` fed by the `changes` job, and the `gate` job below aggregates the result
# into one context that always reports. Trade-off: every pull request in the
# repository now pays for two ~30-second jobs; the expensive job still runs only
# when inputs match the predicate in `changes` below. The context to mark
# required is `Dashboard gate` (a status context is the job's name), never the
# `dashboard` job itself, which legitimately reports `skipped`.

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs are cancelled; `main` runs are not (that is the recorded
# history). See risk-service.yml for the reasoning.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A merge-queue entry runs the dashboard job unconditionally: the queued merge
# result is what lands on main, so its checks must actually run there — a
# green queue used to hide failures that only surfaced on main, like the
# unit-coverage ratchet. `changed_area.sh` already
# answers "true" for every non-pull_request event, so the same path filter
# below the trigger serves all three events: a docs-only pull request still
# skips the expensive job, while queue entries and pushes to main always run.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      dashboard: ${{ steps.areas.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Dashboard tests consume backend/app/, backend/pyproject.toml and
      # backend/uv.lock (contracts loaded through `uv run`),
      # backend/tests/fixtures/icaap/editor_schema_samples.json (editor parity),
      # and backend/alembic/versions/202608280046_initial_org_owner_assignment.py
      # (BI role labels).
      - id: areas
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          .github/scripts/changed_area.sh dashboard
          '^(backend/dashboard/|backend/app/|backend/pyproject\.toml$|backend/uv\.lock$|backend/tests/fixtures/icaap/editor_schema_samples\.json$|backend/alembic/versions/202608280046_initial_org_owner_assignment\.py$|packages/risk-service-api/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.github/workflows/dashboard\.yml$|\.github/scripts/)'

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          # Pinned with risk-service.yml — see MISE VERSION there.
          version: 2026.7.7
          install_args: python@3.13 uv@0.11.18 node@24 pnpm@11.2.2
      - name: Install backend dependencies for route parity test
        working-directory: backend
        run: uv sync --frozen
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck generated API client
        run: pnpm --filter @aequoros/risk-service-api exec tsc --noEmit
      - name: Test generated API client
        run: pnpm --filter @aequoros/risk-service-api test
      - name: Typecheck dashboard
        run: pnpm --filter dashboard exec tsc --noEmit
      - name: Lint dashboard
        run: pnpm --filter dashboard lint
      - name: Guard dashboard feature boundaries
        run: pnpm --filter dashboard guard:features
      - name: Test dashboard
        env:
          DASHBOARD_UNIT_REPORT: ${{ runner.temp }}/dashboard-unit-files.json
        run: pnpm --filter dashboard test:coverage
      - name: Upload dashboard unit collection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-unit-collection
          path: ${{ runner.temp }}/dashboard-unit-files.json
          if-no-files-found: error
      - name: Upload dashboard unit coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-unit-coverage
          path: backend/dashboard/coverage/
          if-no-files-found: error
      - name: Build dashboard
        run: pnpm --filter dashboard build

  # The single context to mark required for this workflow. `dashboard` reports
  # `skipped` on a pull request that does not touch it, and a skipped required
  # check never satisfies branch protection — acceptable on a pull request,
  # where the filtered job was not owed. On a merge_group entry the dashboard
  # job is owed (the queue's merge result lands on main), so the gate refuses
  # a skipped dependency there; see .github/scripts/gate_result.sh.
  gate:
    name: Dashboard gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [changes, dashboard]
    steps:
      # The runner workspace starts empty; the gate script lives in the repo.
      - uses: actions/checkout@v4
      - name: Require every dashboard gate to have passed
        env:
          GATE_LABEL: Dashboard
          GATE_EVENT: ${{ github.event_name }}
          GATE_NEEDS: ${{ toJSON(needs) }}
        run: .github/scripts/gate_result.sh
