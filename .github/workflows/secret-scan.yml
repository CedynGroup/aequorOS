name: secret-scan

# Runs the free gitleaks CLI from its official container image. The gitleaks-action
# wrapper requires a paid license on organization repos; the CLI does not. Job
# name stays "gitleaks" so it keeps satisfying the required branch-protection check.

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      # Keep the required context successful in the queue without repeating PR scans.
      - name: Accept the completed pull-request secret scans
        if: github.event_name == 'merge_group'
        run: echo 'Secret scans are checked on the pull request.'
      # Full history supplies the PR merge base and the existing push-time scan.
      - uses: actions/checkout@v4
        if: github.event_name != 'merge_group'
        with:
          fetch-depth: 0
      - name: Pull gitleaks image
        if: github.event_name != 'merge_group'
        run: |
          set -euo pipefail
          docker pull "$GITLEAKS_IMAGE"
          docker run --rm --pull=never "$GITLEAKS_IMAGE" version
      # Pushes retain the working-tree and full-history scans. PRs read only
      # what they touch: the commit diffs in their base..HEAD range, plus the
      # complete content of each file that range changes. Reading whole files,
      # not just the added lines, keeps rules that need surrounding context
      # working; limiting that read to changed files keeps pre-existing
      # findings in untouched files from failing an unrelated PR.
      - name: Scan working tree
        if: github.event_name == 'push'
        run: |
          docker run --rm --pull=never --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo \
            "$GITLEAKS_IMAGE" detect --source . --no-git --config .gitleaks.toml --redact -v
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The checkout is `refs/pull/<n>/merge`, so HEAD is the merge result of
          # the base branch and the pull request. Its merge base with the base is
          # where this pull request's own commits start.
          base=$(git merge-base "$BASE_SHA" HEAD)
          echo "Scanning ${base}..HEAD ($(git rev-list --count "${base}..HEAD") commit(s) in range)."
          docker run --rm --pull=never --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo" --workdir /repo \
            "$GITLEAKS_IMAGE" detect --source . --config .gitleaks.toml --redact -v \
            --log-opts="--diff-merges=remerge ${base}..HEAD"
      - name: Scan the pull request's changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base=$(git merge-base "$BASE_SHA" HEAD)
          paths="${RUNNER_TEMP}/pull-request-paths"
          content="${RUNNER_TEMP}/pull-request-content"
          git diff --name-only -z --diff-filter=d "$base" HEAD > "$paths"
          rm -rf "$content"
          mkdir -p "$content"
          changed=0
          while IFS= read -r -d '' path; do
            # A rename reports both names on some diff settings; only the paths
            # that exist in this checkout can be copied.
            [ -f "$path" ] || continue
            mkdir -p "$content/$(dirname "$path")"
            cp -- "$path" "$content/$path"
            changed=$((changed + 1))
          done < "$paths"
          echo "Scanning the complete content of ${changed} file(s) this pull request changes."
          docker run --rm --pull=never --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$content:/repo:ro" --workdir /repo \
            "$GITLEAKS_IMAGE" detect --source . --no-git --config /workspace/.gitleaks.toml --redact -v
      - name: Scan git history
        if: github.event_name == 'push'
        run: |
          docker run --rm --pull=never --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo \
            "$GITLEAKS_IMAGE" detect --source . --config .gitleaks.toml --redact -v
