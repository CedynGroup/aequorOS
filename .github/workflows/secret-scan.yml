name: secret-scan

# Runs the free gitleaks BINARY directly. The gitleaks-action wrapper requires a
# paid license on organization repos; the CLI does not. Job name stays "gitleaks"
# so it keeps satisfying the required branch-protection check.

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Keep the required context successful in the queue without repeating PR scans.
      - name: Accept the completed pull-request secret scans
        if: github.event_name == 'merge_group'
        run: echo 'Secret scans are checked on the pull request.'
      - uses: actions/checkout@v4
        if: github.event_name != 'merge_group'
        with:
          fetch-depth: 0
      - name: Install gitleaks
        if: github.event_name != 'merge_group'
        run: |
          # Installation and checksum failures must fail the required check.
          set -euo pipefail
          VER=8.30.1
          ASSET="gitleaks_${VER}_linux_x64.tar.gz"
          RELEASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          INSTALL_DIR=$(mktemp -d)
          trap 'rm -rf "$INSTALL_DIR"' EXIT
          cd "$INSTALL_DIR"
          curl -sSfL "${RELEASE_URL}/${ASSET}" -o "$ASSET"
          curl -sSfL "${RELEASE_URL}/gitleaks_${VER}_checksums.txt" -o checksums.txt
          sha256sum --check --strict --ignore-missing checksums.txt
          tar -xzf "$ASSET" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # TWO scans, because they answer different questions and `--no-git` only
      # answers the first. The working-tree scan sees files as they are now,
      # including anything untracked; the history scan sees every commit, which
      # is where a leaked credential actually lives — deleting the file in a
      # later commit does not unpublish the secret. Until 2026-08-21 only the
      # `--no-git` scan ran, so the required "gitleaks" check had never looked
      # at a single commit.
      - name: Scan working tree
        if: github.event_name != 'merge_group'
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact -v
      - name: Scan git history
        if: github.event_name != 'merge_group'
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v
