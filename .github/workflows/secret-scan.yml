name: secret-scan

# Runs the free gitleaks BINARY directly. The gitleaks-action wrapper requires a
# paid license on organization repos; the CLI does not. Job name stays "gitleaks"
# so it keeps satisfying the required branch-protection check.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          # pipefail is load-bearing: without it `curl ... | grep -oP` reports
          # grep's exit code, so a failed release lookup yields an empty TAG and
          # the step walks on. This is the ONE required check on `main` — it must
          # not be able to succeed without having installed and run gitleaks.
          set -euo pipefail
          TAG=$(curl -sSf https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          VER=${TAG#v}
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${TAG}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # TWO scans, because they answer different questions and `--no-git` only
      # answers the first. The working-tree scan sees files as they are now,
      # including anything untracked; the history scan sees every commit, which
      # is where a leaked credential actually lives — deleting the file in a
      # later commit does not unpublish the secret. Until 2026-08-21 only the
      # `--no-git` scan ran, so the required "gitleaks" check had never looked
      # at a single commit.
      - name: Scan working tree
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact -v
      - name: Scan git history
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v
