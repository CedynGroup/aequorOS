name: secret-scan

# Runs the free gitleaks CLI from its official container image. The gitleaks-action
# wrapper requires a paid license on organization repos; the CLI does not. Job
# name stays "gitleaks" so it keeps satisfying the required branch-protection check.

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      # Keep the required context successful in the queue without repeating PR scans.
      - name: Accept the completed pull-request secret scans
        if: github.event_name == 'merge_group'
        run: echo 'Secret scans are checked on the pull request.'
      # The full history is fetched only so the pull request's merge base can be
      # computed; what the scans read is bounded to the commits under review.
      - uses: actions/checkout@v4
        if: github.event_name != 'merge_group'
        with:
          fetch-depth: 0
      - name: Pull gitleaks image
        if: github.event_name != 'merge_group'
        run: |
          set -euo pipefail
          docker pull "$GITLEAKS_IMAGE"
          docker run --rm --pull=never "$GITLEAKS_IMAGE" version
      # THREE scans, because they answer different questions.
      #
      # The working-tree scan reads the checked-out files as they are now, so it
      # flags a secret that is present on the branch even when no commit in the
      # range below added it.
      #
      # The two git scans cover only the change that triggered the run: the
      # commits a pull request adds, and the commits a push to `main` adds. They
      # read commit diffs rather than the working tree because a deleted secret
      # is still published: deleting the file in a later commit does not remove
      # the blob from history.
      #
      # Until 2026-11-02 the only git scan walked every commit the checkout held.
      # A finding in history the pull request never authored then failed pull
      # requests 761, 765 and 766 on two reviewed false positives in
      # `backend/app/case/service/documents.py`. `.gitleaksignore` cannot close
      # that gap, because its fingerprints are keyed to commit SHAs and a rebase
      # rewrites them. History already on the base branch was scanned when it
      # landed, under the same config.
      - name: Scan working tree
        if: github.event_name != 'merge_group'
        run: |
          docker run --rm --pull=never --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo \
            "$GITLEAKS_IMAGE" detect --source . --no-git --config .gitleaks.toml --redact -v
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base_ref }}
        run: |
          set -euo pipefail
          # The checkout is `refs/pull/<n>/merge`, so HEAD is the merge result of
          # the base branch and the pull request. Its merge base with the base is
          # where this pull request's own commits start.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          fi
          base=$(git merge-base "$BASE_SHA" HEAD)
          echo "Scanning ${base}..HEAD ($(git rev-list --count "${base}..HEAD") commit(s) in range)."
          docker run --rm --pull=never --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo \
            "$GITLEAKS_IMAGE" detect --source . --config .gitleaks.toml --redact -v \
            --log-opts="${base}..HEAD"
      - name: Scan the pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          zero='0000000000000000000000000000000000000000'
          after="${AFTER_SHA}"
          if [ -z "$after" ] || [ "$after" = "$zero" ]; then
            after=$(git rev-parse HEAD)
          fi
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "$zero" ]; then
            # A new branch has no previous tip, and nothing behind its tip was
            # ever scanned, so that history is all new.
            echo "New branch: scanning the history behind ${after}."
            log_opts="$after"
          else
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BEFORE_SHA" || true
            fi
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              log_opts="${BEFORE_SHA}..${after}"
            else
              # A rewritten server history can drop the previous tip. Scanning
              # everything behind the pushed tip is the safe reading of a range
              # whose start is unknown.
              echo "::warning::Previous tip ${BEFORE_SHA} is unavailable; scanning all history behind ${after}."
              log_opts="$after"
            fi
          fi
          echo "Scanning ${log_opts} ($(git rev-list --count "$log_opts") commit(s) in range)."
          docker run --rm --pull=never --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo \
            "$GITLEAKS_IMAGE" detect --source . --config .gitleaks.toml --redact -v \
            --log-opts="$log_opts"
