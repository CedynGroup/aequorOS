name: Weekly flake report

# The weekly view of the CI flake measurement (.github/scripts/ci_flake_report.py,
# `weekly` mode): the ranking over a rolling window plus the approved policy's
# threshold crossings, written to this run's step summary.
#
# Visibility only, by design: the workflow creates no issues and no comments —
# a person files the flaky-test issue and picks its owner (>=2 rerun-only
# passes in 14 days; the third recurrence means fix or quarantine within 7
# days). It reads nothing but Actions history, so its permissions are
# read-only, and the script exits 0 with a visible note when the data cannot
# be collected; job-level continue-on-error covers anything unexpected on top
# of that. A red weekly report is never a gate, and the report never gates a
# merge.

on:
  schedule:
    # Mondays 06:00 UTC, so the window covers the full previous week including
    # the weekend's runs.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      window_days:
        description: "Rolling window in days (policy thresholds count rerun-only passes inside it)"
        required: false
        default: "14"

permissions:
  actions: read
  contents: read

jobs:
  weekly-report:
    name: Weekly flake ranking
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      # Read-only history is all this job needs, so the checkout persists no
      # credentials.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Note the unavailable report when checkout failed
        if: failure()
        run: |
          echo "Weekly flake report unavailable: the checkout failed, so there is no report to write. The run itself is unaffected — this report is visibility only." >> "$GITHUB_STEP_SUMMARY"
      - name: Write the ranking and threshold crossings to the step summary
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, not template expansion: a workflow_dispatch caller could
          # otherwise break out of the shell quoting.
          WINDOW_DAYS: ${{ github.event.inputs.window_days || '14' }}
        run: |
          set -euo pipefail
          # A dispatch caller can send a non-numeric or non-positive window;
          # argument parsing would then exit before any summary exists. The
          # note keeps the run's outcome visible either way.
          if ! [[ "$WINDOW_DAYS" =~ ^[1-9][0-9]*$ ]]; then
            echo "Weekly flake report unavailable: the window-days override is not a positive integer (got \"$WINDOW_DAYS\"); the scheduled window is 14 days." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 .github/scripts/ci_flake_report.py weekly \
            --repo "$GITHUB_REPOSITORY" \
            --window-days "$WINDOW_DAYS" \
            --out-md "$RUNNER_TEMP/weekly-flake-report.md" \
            --out-json "$RUNNER_TEMP/weekly-flake-report.json" \
            > "$RUNNER_TEMP/weekly-summary.md" || {
              status=$?
              echo "Weekly flake report unavailable: the report command failed. See the step log for details." >> "$GITHUB_STEP_SUMMARY"
              exit "$status"
            }
          # GitHub rejects a step summary over 1 MiB wholesale: write the
          # clipped summary here; whether the full report survived is noted
          # after the artifact upload below.
          head -c 900000 "$RUNNER_TEMP/weekly-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the full report as an artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-flake-report
          path: |
            ${{ runner.temp }}/weekly-flake-report.md
            ${{ runner.temp }}/weekly-flake-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Note whether the full report was preserved
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          summary="$RUNNER_TEMP/weekly-summary.md"
          full_md="$RUNNER_TEMP/weekly-flake-report.md"
          clipped=0
          if [ -f "$summary" ] && [ "$(wc -c < "$summary")" -gt 900000 ]; then
            clipped=1
          fi
          if [ "$UPLOAD_OUTCOME" = "success" ] && [ -s "$full_md" ]; then
            if [ "$clipped" = "1" ]; then
              printf '\n\n_Summary clipped at 900000 bytes; the full report is in the weekly-flake-report artifact._\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ -f "$summary" ]; then
            printf '\n\n_The full report artifact could not be uploaded; the summary above may be clipped without a complete copy._\n' >> "$GITHUB_STEP_SUMMARY"
          fi
