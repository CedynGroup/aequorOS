name: Dashboard Playwright journeys

# Always report the gate; filter expensive shards inside the job graph.
# The stack Playwright boots (backend/dashboard/playwright.config.ts) includes
# the local OIDC issuer the SSO journeys sign in at (backend/scripts/e2e_idp.py).
# It is a plain Python process started as a Playwright web server, so unlike
# MinIO below it needs no step of its own here.
on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect journey changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      journeys: ${{ steps.areas.outputs.journeys }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: areas
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          .github/scripts/changed_area.sh journeys
          '^([^/]+\.md$|LICENSE$|docs/|backend/docs/|(backend|backend/dashboard|console|frontend|deploy)/README\.md$|frontend/(app/|components/|lib/|public/))'
          --ignore

  journeys:
    name: Dashboard journeys shard ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.journeys == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Each runner owns its disposable database, fixture bank and MinIO. Keep
    # Playwright's single worker; shard files without sharing mutable fixtures.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      bank-kms:
        image: nsmithuk/local-kms:3.11.7@sha256:360d7377b6f3687c89a622236791e4fa3f7316366267b437829edbdfa8a5fc60
        env:
          KMS_REGION: us-east-1
          KMS_ACCOUNT_ID: "111122223333"
        ports:
          - 18080:8080
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          # Pinned to match the repository's other CI workflows.
          version: 2026.7.7
          install_args: python@3.13 uv@0.11.18 node@24 pnpm@11.2.2
      - name: Install risk service dependencies
        run: mise run risk-service:sync
      - name: Exercise the real AWS key provider against local KMS
        env:
          TEST_KMS_ENDPOINT_URL: http://127.0.0.1:18080
          PYTEST_ADDOPTS: --junitxml=/tmp/kms-contract.xml
        run: |
          mise exec -- uv run --directory backend pytest tests/storage/test_kms_emulator.py -q
          python .github/scripts/assert_pytest_ran.py /tmp/kms-contract.xml --min-executed 1 --max-skipped 0
      - name: Install workspace dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      # The browser build is fixed by the exact @playwright/test pin in the
      # dashboard's package.json, so that file keys the cache. The system
      # libraries are apt packages outside the cache and install either way.
      - name: Cache the Playwright browsers
        id: playwright-browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/dashboard/package.json') }}
      - name: Install Chromium and browser system dependencies
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: mise exec -- pnpm --filter @aequoros/dashboard exec playwright install --with-deps chromium
      - name: Install browser system dependencies
        if: steps.playwright-browsers.outputs.cache-hit == 'true'
        run: mise exec -- pnpm --filter @aequoros/dashboard exec playwright install-deps chromium
      # Shared with Storage contract CI: real SSE-KMS storage on loopback.
      - name: Start MinIO with built-in KMS
        id: minio
        uses: ./.github/actions/setup-minio
      - name: Run dashboard journeys
        env:
          BANK_KMS_ENDPOINT_URL: http://127.0.0.1:18080
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ACCESS_KEY: ciminio
          S3_SECRET_KEY: ciminio123
          S3_REGION: us-east-1
          S3_BUCKET: aequoros
          STORAGE_BACKEND: minio
          STORAGE_ENV: mvp
          STORAGE_RETIRE_AFTER: "2099-01-01"
          STORAGE_KMS_KEY_ID: aequoros-key
          PLAYWRIGHT_QUARANTINE_REPORT: ${{ runner.temp }}/journeys.json
          E2E_EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: mise exec -- pnpm --filter @aequoros/dashboard e2e --shard=${{ matrix.shard }}/4
      # Reviewer-visible screenshots the authorization and SSO journeys write
      # (the issuer's form, the signed-in shell, the refusals, the step-up
      # return). Uploaded even on failure: that is when they matter most.
      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-journey-evidence-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
      - name: Upload journey report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-journey-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/journeys.json
          if-no-files-found: error
      # The quarantine size (e2e/support/quarantine.ts) is pinned here on
      # purpose: parking or releasing a journey means editing this gate as well
      # as the list, so a quarantine is always a visible, reviewed decision
      # with a reason beside it, never a quiet default.
      - name: The browser journeys must have executed, not skipped
        run: |
          set -euo pipefail
          jq . "$RUNNER_TEMP/journeys.json"
          jq -e '
            .executed >= 20 and
            .quarantinedExecuted == 0 and
            .quarantineSize == 0 and
            (.integrityErrors | length) == 0
          ' "$RUNNER_TEMP/journeys.json" >/dev/null
      - name: Stop MinIO
        if: always() && steps.minio.outputs.pid != ''
        env:
          SERVICE_PID: ${{ steps.minio.outputs.pid }}
        run: kill "$SERVICE_PID" 2>/dev/null || true

  gate:
    name: Dashboard journeys gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, journeys]
    steps:
      - uses: actions/checkout@v4
      - name: Download shard reports
        if: needs.changes.outputs.journeys == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: dashboard-journey-report-*
          path: ${{ runner.temp }}/journey-reports
      - name: Verify complete journey execution and report skipped names
        if: needs.changes.outputs.journeys == 'true'
        run: |
          node .github/scripts/assert_dashboard_journeys.mjs \
            "$RUNNER_TEMP"/journey-reports/*/journeys.json
      - name: Require the journey shards or a verified irrelevant change
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: .github/scripts/dashboard_journeys_gate.sh
