name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Every step below drives the build through a root mise task that proxies
      # into backend/mise.toml. When that file moved in `f33e869` the proxies
      # recursed instead of running anything; this check is stdlib Python with
      # no mise and no uv, so it still reports when the toolchain cannot.
      - name: Verify the mise task wiring
        run: python3 .github/scripts/mise_wiring_preflight.py
      - uses: jdx/mise-action@v5
        with:
          # Pinned: a release must be reproducible, and mise-action installs a
          # floating version by default. Keep in step with risk-service.yml.
          version: 2026.7.7
          install_args: python@3.13 uv@0.11.18 node@24 pnpm@11.2.2
      - name: Install risk service dependencies
        run: mise run risk-service:sync
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source quality
        run: mise run risk-service:lint && mise run risk-service:typecheck
      - name: Verify hermetic test suite
        run: mise run risk-service:test
      - name: Verify generated API client freshness
        run: mise run risk-service:api-fresh

  publish-risk-service:
    needs: verify
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials for public ECR pulls
        if: vars.AWS_ECR_PULL_ROLE_ARN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PULL_ROLE_ARN }}
          aws-region: us-east-1
      - name: Log in to Amazon ECR Public
        if: vars.AWS_ECR_PULL_ROLE_ARN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Build and publish immutable image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aequoros-risk-service:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/aequoros-risk-service:latest

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
