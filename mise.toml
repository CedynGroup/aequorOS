[settings]
auto_install = false

[tools]
node = "24"
pnpm = "11.2.2"
python = "3.13"
uv = "0.11.18"

# ---------------------------------------------------------------------------
# THE DELEGATION CONTRACT, and the outage that made it worth writing down.
#
# Every `risk-service:*` task below is a two-line proxy: `dir = "backend"` moves
# into the service directory, and `run = "mise run risk-service:<same name>"`
# re-invokes mise there, where `backend/mise.toml` defines the same name with
# the real command. CI runs `mise run` from the repository ROOT, so this file is
# the one that has to carry every task a workflow names; the backend file is the
# one that has to carry every real command.
#
# Both halves are load-bearing, and the second half failed. Commit `f33e869`
# (2026-08-20) moved `backend/mise.toml` to `backend/docs/mise.toml`. With the
# target gone, each proxy re-resolved to ITSELF and recursed — measured under
# mise 2026.7.7 against exactly that layout: 525 self-invocations in 8 seconds,
# `uv` never started. The `Risk Service CI` run on 2026-08-21 died in its first
# step, "Install risk service dependencies", after 440 of them, and read like a
# hang rather than a missing file.
#
# So the invariant is: EVERY task here must exist in BOTH files, and the backend
# one must hold the real command. A task defined only in the backend file is
# "task not found" in CI while working perfectly in a local `cd backend` shell;
# a task defined only here recurses until the runner gives up.
#
# It is guarded in two places, deliberately not one:
#   * `backend/tests/architecture/test_ci_task_wiring.py` — the static contract
#     (no self-delegation, every workflow-invoked task defined here, every
#     delegation target present in the backend file);
#   * `.github/scripts/mise_wiring_preflight.py` — the SAME check in plain
#     Python with no mise and no uv, run as the `preflight` job every other job
#     depends on. The test above cannot catch this failure on its own: reaching
#     it requires `mise run risk-service:test`, which is itself one
#     of the proxies that recurses. A guard that can only run when the thing it
#     guards is healthy is not a guard.
# ---------------------------------------------------------------------------

[tasks.setup]
description = "Prepare a fresh checkout: pinned tools, dependencies, env files, and hooks"
# Locked syncs keep a fresh checkout reproducible: UV_LOCKED asserts that uv.lock
# matches pyproject.toml, so a stale lockfile fails loudly instead of being used
# silently. Env copies never overwrite a local file, and an existing managed
# core.hooksPath chain is preserved.
env = { UV_LOCKED = "1" }
run = [
  "mise install",
  # ``mise`` computes this task's PATH before running any entry, so a tool it
  # installs here is not yet visible to the rest of the array. ``mise exec``
  # re-resolves the tool environment, which is what makes setup reliable on a
  # machine where the pinned tools were absent.
  "mise exec -- python3 backend/scripts/bootstrap.py env",
  "mise exec -- pnpm install --frozen-lockfile",
  "mise run risk-service:sync",
  "mise run risk-service:hooks",
  "mise exec -- python3 backend/scripts/bootstrap.py report",
]

[tasks.verify]
description = "Prove core checkout readiness without Docker, a database, or a service"
# Deliberately no dependencies: verify uses what setup installed and must never
# sync, install, or start anything on its own.
run = "python3 backend/scripts/bootstrap.py verify"

[tasks."risk-service:sync"]
description = "Install risk service dependencies with uv"
dir = "backend"
run = "mise run risk-service:sync"

[tasks."risk-service:hooks"]
description = "Install risk service pre-commit, commit-msg, and pre-push hooks"
dir = "backend"
run = "mise run risk-service:hooks"

[tasks."risk-service:precommit"]
description = "Run risk service pre-commit hooks against all files"
dir = "backend"
run = "mise run risk-service:precommit"

[tasks."risk-service:dev"]
description = "Run risk service FastAPI dev server"
dir = "backend"
run = "mise run risk-service:dev"

[tasks."risk-service:worker"]
description = "Run the risk service live-engine background worker"
dir = "backend"
run = "mise run risk-service:worker"

[tasks."risk-service:worker-ai"]
description = "Run the risk service AI worker (ai lane only)"
dir = "backend"
run = "mise run risk-service:worker-ai"

[tasks."risk-service:test"]
description = "Run bounded unit-only feedback; add --lf for cached unit failures"
dir = "backend"
run = "mise run risk-service:test"

[tasks."risk-service:lint"]
description = "Run risk service Ruff checks"
dir = "backend"
run = "mise run risk-service:lint"

[tasks."risk-service:format"]
description = "Format risk service Python files with Ruff"
dir = "backend"
run = "mise run risk-service:format"

[tasks."risk-service:typecheck"]
description = "Run the risk service BasedPyright strict type-check baseline"
dir = "backend"
run = "mise run risk-service:typecheck"

[tasks."risk-service:check"]
description = "Run static lint, types and task-wiring contracts; no tests"
dir = "backend"
run = "mise run risk-service:check"

[tasks."risk-service:openapi-schema"]
description = "Generate risk service OpenAPI schema"
dir = "backend"
run = "mise run risk-service:openapi-schema"

[tasks."risk-service:openapi-client"]
description = "Generate risk service TypeScript OpenAPI client"
dir = "backend"
run = "mise run risk-service:openapi-client"

[tasks."risk-service:api-typecheck"]
description = "Type-check the generated risk service API client"
run = "pnpm --filter @aequoros/risk-service-api run type-check"

[tasks."risk-service:api-fresh"]
description = "Regenerate and verify the risk service API client is fresh"
run = [
  "mise run risk-service:openapi-client",
  "mise run risk-service:api-typecheck",
  "test -z \"$(git status --porcelain -- backend/openapi-schema.json packages/risk-service-api)\"",
]

[tasks."risk-service:migrate"]
description = "Run risk service Alembic migrations; credentials: backend/docs/tamper_evident_records.md#required-deployment-follow-up"
dir = "backend"
run = "mise run risk-service:migrate"

[tasks."risk-service:bootstrap-db"]
description = "Create risk service local DB roles, run migrations, and grant app privileges"
dir = "backend"
run = "mise run risk-service:bootstrap-db"

[tasks."risk-service:revision"]
description = "Create risk service Alembic revision"
dir = "backend"
usage = '''
arg "<message>" help="Revision message"
'''
run = 'mise run risk-service:revision "${usage_message?}"'
