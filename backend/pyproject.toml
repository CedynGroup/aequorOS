[project]
name = "risk-service"
version = "0.1.0"
description = "FastAPI backend foundation for the AequorOS financial risk MVP."
readme = "README.md"
license = { file = "../LICENSE" }
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic",
  "argon2-cffi",
  "boto3",
  "cryptography",
  "fastapi[standard]",
  "jellyfish",
  "loguru",
  "metaphone",
  "numpy",
  "openpyxl",
  "oracledb",
  "pandas",
  # Market-desk PDF sources (app/services/market_desk/sources): pypdf-style
  # extraction emits BoG auction tables column-major (row association lost) and
  # the APR-of-banks PDF positions glyphs individually on three of its nine
  # table pages — parsing needs character geometry (pdfplumber.page.chars),
  # which pypdf does not expose.
  "pdfplumber",
  # Direct import, not a reportlab leftover: attestation/appearance.py decodes and
  # re-rasters an officer's drawn signature, and pyhanko embeds the result. Listed
  # explicitly so the guarantee does not rest on another package's dependency tree.
  "pillow",
  "psycopg[binary]",
  "pyarrow",
  "pydantic-settings",
  "pyhanko[opentype]",
  "pyhanko-certvalidator",
  "pyjwt[crypto]",
  "pyyaml",
  "rapidfuzz",
  "reportlab>=4.0,<5.1",  # pinned: deterministic bytes rely on invariant=1 (G12)
  "scikit-learn",
  # Direct import, not a scikit-learn leftover: the curve library
  # (app/domain/curves) uses scipy.interpolate.PchipInterpolator and
  # scipy.optimize.least_squares. Listed explicitly so the guarantee does not
  # rest on another package's dependency tree.
  "scipy",
  "sqlalchemy",
  "torch",
]

# Driver-heavy database-direct backends. Lazily imported by
# app/adapters/database_direct, so the default environment stays installable and
# fixture tests run without them. Install when wiring a live source database:
#   uv sync --extra db-direct
[project.optional-dependencies]
# Hardware signing custody (docs/attestation_esignature.md §3.4). The PKCS#11
# driver is lazily imported inside app/services/attestation/signers.py, so the
# default environment stays installable and the software/dev backend and its
# tests run without an HSM. Install when wiring a real token/HSM:
#   uv sync --extra hsm
hsm = [
  "python-pkcs11", # PKCS#11 binding pyhanko.sign.pkcs11 wraps (needs a vendor .so)
]
db-direct = [
  "pyodbc",     # ODBC + SQL Server (needs unixODBC / a system ODBC driver)
  "jaydebeapi", # generic JDBC via a bank-supplied JDBC driver jar
  "JPype1",     # JVM bridge for jaydebeapi
  "snowflake-connector-python", # Snowflake warehouse (key-pair auth, Streams CDC)
  "cryptography",               # loads the RSA private key for Snowflake key-pair auth
]

[dependency-groups]
dev = [
  "basedpyright",
  "httpx",
  "openapi-generator-cli[jdk4py]>=7.13,<7.25",
  "pre-commit==4.6.2",
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR2004"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["app", "tests", "alembic", "scripts"]
exclude = [".venv"]
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false

# --- torch: CPU-only wheels on Linux -----------------------------------------
# On Linux the default PyPI torch wheel drags the full NVIDIA CUDA stack
# (~2.5GB download / ~8GB installed: cublas, cudnn, cufft, nccl, triton, ...).
# Production runs on CPU-only servers and the cash-flow LSTM is CPU-sized, so
# pin Linux to the official CPU index. macOS keeps the default (small) wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
