[tools]
python = "3.13"
uv = "latest"

[tasks."risk-service:sync"]
description = "Install dependencies with uv"
run = "uv sync"

[tasks."risk-service:hooks"]
description = "Install pre-commit, commit-msg, and pre-push hooks"
run = "uv run pre-commit install --config ../../.pre-commit-config.yaml --install-hooks"

[tasks."risk-service:precommit"]
description = "Run pre-commit hooks against all files"
run = "uv run pre-commit run --all-files --config ../../.pre-commit-config.yaml"

[tasks."risk-service:dev"]
description = "Run FastAPI and the live-engine worker for local development"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Development must exercise the same API-plus-worker topology as deployment.
# Do not rely on a developer's .env value to create an in-process worker.
RUN_INPROCESS_WORKER=0 uv run python -m app.worker &
worker_pid=$!
trap 'kill "$worker_pid" 2>/dev/null || true' EXIT INT TERM

RUN_INPROCESS_WORKER=0 uv run fastapi dev app/main.py --host "${HOST:-127.0.0.1}" --port "${PORT:-8001}" --reload-dir app
'''

[tasks."risk-service:worker"]
description = "Run the live-engine background worker (claim → dispatch → retry)"
run = "uv run python -m app.worker"

[tasks."risk-service:test"]
description = "Run pytest"
run = "uv run pytest"

[tasks."risk-service:test-postgres"]
description = "Run pytest against local Docker Postgres"
env = { TEST_DATABASE_URL = "postgresql+psycopg://postgres:postgres@localhost:15432/risk_service" }
run = "uv run pytest"

[tasks."risk-service:test-postgres-migrations"]
description = "Run Postgres-backed Alembic migration tests; requires TEST_DATABASE_URL"
run = "uv run pytest tests/db/test_postgres_migrations.py"

# The concurrency tests guard row locks and advisory locks, which SQLite cannot
# express — they self-skip ("PostgreSQL row locks are required for concurrency
# coverage") on the hermetic run. Until 2026-07-31 CI passed TEST_DATABASE_URL
# only to the migrations task, so these ran in NO environment: green locally
# because skipped, green in CI because never invoked. Running them found a
# Boolean column with an integer server_default that made CREATE TABLE fail on
# Postgres outright, plus four tests comparing the String(40) audit_events.
# entity_id against UUID objects. Requires TEST_DATABASE_URL.
[tasks."risk-service:test-postgres-locks"]
description = "Run the Postgres-only concurrency tests; requires TEST_DATABASE_URL"
run = "uv run pytest tests/api/test_liquidity.py tests/api/test_scenarios.py tests/api/test_calculations.py"

# The architecture guards: CI task wiring (P0-15), the RLS-blind data-migration
# scanner (P0-18) and the case/regulatory dependency boundary (ARCH-5). Fast,
# hermetic, and deliberately its own gate so a boundary breach is reported as a
# boundary breach rather than buried in a 3,000-test run.
[tasks."risk-service:test-architecture"]
description = "Run the architecture, dependency-boundary and migration-guard tests"
run = "uv run pytest tests/architecture tests/db/test_bog_return_recode_migration.py"

# Schema-level truth: the migration chain, the RLS policies it installs, and the
# server defaults. RLS exists ONLY in migrations (the hermetic suite builds its
# schema with Base.metadata.create_all), so this is the only place row-level
# security is exercised at all. Requires TEST_DATABASE_URL.
[tasks."risk-service:test-postgres-schema"]
description = "Run the Postgres schema, migration and RLS suites; requires TEST_DATABASE_URL"
run = "uv run pytest tests/db"

# The whole suite against the real engine. The hermetic default runs on SQLite
# with row-level security switched off, so "3,237 passed" is not evidence about
# Postgres: Boolean server defaults, String-vs-UUID comparisons, row locks and
# advisory locks all behave differently there. Requires TEST_DATABASE_URL.
[tasks."risk-service:test-postgres-suite"]
description = "Run the full pytest suite against Postgres; requires TEST_DATABASE_URL"
run = "uv run pytest"

# The DB-backed regulatory/attestation/auth/vendor API surface. It is gated on
# REAL_DATA_DATABASE_URL pointing at the PRIMARY database (it asserts against
# real tenant identities), so it cannot run on an ephemeral CI Postgres; without
# that URL every one of these tests skips.
#
# The path list omitted tests/adapters and tests/equivalence until 2026-08-22,
# so three modules — including the regulatory report/forecast run-parity suites
# — were unreachable even WITH the URL set, and their 23 tests could never run
# anywhere. `tests/architecture/test_ci_task_wiring.py` now derives the required
# paths from the `requires_real_data` marker, so the list cannot fall behind a
# new module again.
#
# `-m 'not slow'` was removed in the same change: the repository defines no
# `slow` marker and nothing is marked with one, so the filter selected
# everything while implying a tier that does not exist.
[tasks."risk-service:test-real-data"]
description = "Run the opt-in real-data API suite; requires REAL_DATA_DATABASE_URL"
run = "uv run pytest tests/adapters tests/api tests/equivalence tests/features tests/services"

# The live S3-compatible backend contract: SSE-KMS at rest, the hash-chained
# access log, and provisioning/deprovisioning of a per-institution bucket. The
# suite self-skips when S3_* is unconfigured. Before the dedicated storage and
# Playwright journey jobs were added, that described every CI job: measured with
# the credentials blanked, `27 passed, 18 skipped`. The storage job now supplies
# MinIO with built-in KMS and requires all 45 tests to execute.
#
# A MinIO container with its BUILT-IN KMS satisfies all 18 — no KES sidecar is
# needed, which is what made this look unreachable. Measured against
# `MINIO_KMS_SECRET_KEY=aequoros-key:<base64-32>`: `45 passed`.
#
# Two sharp edges, both found by running it:
#   * the KMS key MUST be named `aequoros-key` — the SSE-KMS assertion pins that
#     literal against the returned `SSEKMSKeyId`;
#   * export STORAGE_RETIRE_AFTER for the configured MVP client. The pure config
#     test deletes it before asserting that a missing date is refused.
#
# Requires S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY and STORAGE_KMS_KEY_ID.
[tasks."risk-service:test-storage"]
description = "Run the S3-compatible storage contract suite; requires S3_* credentials"
run = "uv run pytest tests/storage"

[tasks."risk-service:lint"]
description = "Run Ruff checks"
run = "uv run ruff check ."

[tasks."risk-service:format"]
description = "Format Python files with Ruff"
run = [
  "uv run ruff format .",
  "uv run ruff check . --fix",
]

[tasks."risk-service:typecheck"]
description = "Run BasedPyright"
run = "uv run basedpyright"

[tasks."risk-service:check"]
description = "Run lint, typecheck, and tests"
depends = ["risk-service:lint", "risk-service:typecheck", "risk-service:test"]

[tasks."risk-service:openapi-schema"]
description = "Generate OpenAPI schema"
run = "PYTHONPATH=. uv run python scripts/export_openapi_schema.py openapi-schema.json"

[tasks."risk-service:openapi-client"]
description = "Generate TypeScript OpenAPI client"
depends = ["risk-service:openapi-schema"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

ROOT="$(cd .. && pwd)"
OPENAPI_CLIENT="$ROOT/packages/risk-service-api"
CLIENT_SCHEMA="openapi-client-schema.json"

trap 'rm -f "$CLIENT_SCHEMA"' EXIT
uv run python scripts/prepare_openapi_client_schema.py openapi-schema.json "$CLIENT_SCHEMA"

echo "Generating TypeScript client from OpenAPI schema..."
echo "Cleaning old generated files..."
rm -rf "$OPENAPI_CLIENT/src"
rm -rf "$OPENAPI_CLIENT/dist"
rm -rf "$OPENAPI_CLIENT/.openapi-generator"

uv run openapi-generator-cli generate \
  -i "$CLIENT_SCHEMA" \
  -g typescript-fetch \
  -o "$OPENAPI_CLIENT" \
  -c openapi-config.yaml \
  --additional-properties=supportsES6=true \
  --skip-validate-spec

echo "Restoring source-first package.json configuration..."
uv run python scripts/fix-api-client-package.py "$OPENAPI_CLIENT/package.json" openapi-schema.json

echo "Normalizing generated TypeScript code..."
(cd "$ROOT" && pnpm -w exec prettier --ignore-path /dev/null --write packages/risk-service-api/src/ packages/risk-service-api/README.md)

echo ""
echo "TypeScript client generated successfully."
'''

[tasks."risk-service:migrate"]
description = "Run Alembic migrations; requires DATABASE_URL"
run = "uv run alembic upgrade head"

[tasks."risk-service:bootstrap-db"]
description = "Create local DB roles, run migrations, and grant app privileges"
run = "./scripts/bootstrap_db.sh"

[tasks."risk-service:revision"]
description = "Create Alembic revision"
usage = '''
arg "<message>" help="Revision message"
'''
run = '''
#!/usr/bin/env bash
uv run alembic revision --autogenerate -m "${usage_message?}"
'''

[tasks."risk-service:smoke"]
description = "Run local smoke checks that do not require Postgres"
depends = ["risk-service:sync"]
run = [
  "uv run ruff check .",
  "uv run basedpyright",
  "uv run pytest",
]
