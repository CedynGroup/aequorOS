[tools]
python = "3.13"
uv = "0.11.18"

[tasks."risk-service:sync"]
description = "Install dependencies with uv"
run = "uv sync"

[tasks."risk-service:hooks"]
description = "Install pre-commit, commit-msg, and pre-push hooks"
run = "uv run python scripts/bootstrap.py hooks --root .."

[tasks."risk-service:precommit"]
description = "Run pre-commit hooks against all files"
run = "uv run pre-commit run --all-files --config ../.pre-commit-config.yaml"

[tasks."risk-service:dev"]
description = "Run FastAPI and the live-engine worker for local development"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Development must exercise the same API-plus-worker topology as deployment.
# Do not rely on a developer's .env value to create an in-process worker.
RUN_INPROCESS_WORKER=0 uv run python -m app.worker &
worker_pid=$!
trap 'kill "$worker_pid" 2>/dev/null || true' EXIT INT TERM

RUN_INPROCESS_WORKER=0 uv run fastapi dev app/main.py --host "${HOST:-127.0.0.1}" --port "${PORT:-8001}" --reload-dir app
'''

[tasks."risk-service:worker"]
description = "Run the live-engine background worker (claim → dispatch → retry)"
run = "uv run python -m app.worker"

[tasks."risk-service:worker-ai"]
description = "Run the AI worker (the ai lane only — the one process with the model key)"
run = "WORKER_JOB_TYPES=lane:ai RUN_INPROCESS_WORKER=0 uv run python -m app.worker"

[tasks."risk-service:worker-bi"]
description = "Run the BI mart worker (the bi lane only — mart refresh, backfill, retention)"
run = "WORKER_JOB_TYPES=lane:bi RUN_INPROCESS_WORKER=0 uv run python -m app.worker"

[tasks."risk-service:test"]
description = "Run bounded unit-only feedback; add --lf for cached unit failures"
run = "uv run python -m scripts.test_fast"

[tasks."risk-service:lint"]
description = "Run Ruff checks and the lint count ratchet"
run = [
  "uv run ruff check .",
  "uv run python scripts/lint_baseline.py check",
]

[tasks."risk-service:format"]
description = "Format Python files with Ruff"
run = [
  "uv run ruff format .",
  "uv run ruff check . --fix",
]

[tasks."risk-service:typecheck"]
description = "Run the BasedPyright strict type-check baseline"
run = "uv run python scripts/type_check_baseline.py check"

[tasks."risk-service:check"]
description = "Run static lint, types and task-wiring contracts; no tests"
depends = ["risk-service:lint", "risk-service:typecheck"]
run = "python3 ../.github/scripts/mise_wiring_preflight.py"

[tasks."risk-service:openapi-schema"]
description = "Generate OpenAPI schema"
run = "PYTHONPATH=. uv run python scripts/export_openapi_schema.py openapi-schema.json"

[tasks."risk-service:openapi-client"]
description = "Generate TypeScript OpenAPI client"
depends = ["risk-service:openapi-schema"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

ROOT="$(cd .. && pwd)"
OPENAPI_CLIENT="$ROOT/packages/risk-service-api"
CLIENT_SCHEMA="openapi-client-schema.json"

trap 'rm -f "$CLIENT_SCHEMA"' EXIT
uv run python scripts/prepare_openapi_client_schema.py openapi-schema.json "$CLIENT_SCHEMA"

echo "Generating TypeScript client from OpenAPI schema..."
echo "Cleaning old generated files..."
rm -rf "$OPENAPI_CLIENT/src"
rm -rf "$OPENAPI_CLIENT/dist"
rm -rf "$OPENAPI_CLIENT/.openapi-generator"

uv run openapi-generator-cli generate \
  -i "$CLIENT_SCHEMA" \
  -g typescript-fetch \
  -o "$OPENAPI_CLIENT" \
  -c openapi-config.yaml \
  --additional-properties=supportsES6=true \
  --skip-validate-spec

echo "Restoring source-first package.json configuration..."
uv run python scripts/fix-api-client-package.py "$OPENAPI_CLIENT/package.json" openapi-schema.json

echo "Normalizing generated TypeScript code..."
(cd "$ROOT" && pnpm -w exec prettier --ignore-path /dev/null --write packages/risk-service-api/src/ packages/risk-service-api/README.md)

echo ""
echo "TypeScript client generated successfully."
'''

[tasks."risk-service:migrate"]
description = "Run Alembic migrations; credentials: docs/tamper_evident_records.md#required-deployment-follow-up"
run = "uv run alembic upgrade head"

[tasks."risk-service:bootstrap-db"]
description = "Create local DB roles, run migrations, and grant app privileges"
run = "./scripts/bootstrap_db.sh"

[tasks."risk-service:revision"]
description = "Create Alembic revision"
usage = '''
arg "<message>" help="Revision message"
'''
run = '''
#!/usr/bin/env bash
uv run alembic revision --autogenerate -m "${usage_message?}"
'''
