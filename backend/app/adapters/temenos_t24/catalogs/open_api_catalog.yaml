# Temenos T24 — Transact Open APIs / Data Hub connection-mode catalog.
#
# Derived from the OFS catalog: identical canonical output, REST source
# field names (camelCase) and published Open API resource endpoints. Endpoint
# + field names are DEFAULTS overridable per bank via connection
# catalog_overrides. A domain stays supported:false until its Open API JSON
# schema is confirmed for the bank's Transact release.
#
# A field name may only be ADDED here where the identifier is already in the
# repository and a reviewer can check it without a Temenos portal account
# (docs/data_engine.md §9 documents table names only and forbids inventing
# more). `coCode: branch_id` on the money-market and securities entries (added
# 2026-09-28) qualifies three ways: it is already each entry's own selection
# key, the lending / deposit / current-account entries already map it to
# `branch_id`, and this adapter's Open API fixtures for all three domains carry
# it. It lands `attributes.branch_id`, matched against
# `business_units.business_unit_id` (BUSINESS_UNITS maps companyCode to it) —
# the key the BI branch dimension resolves against. A resource that omits the
# field leaves it unpopulated; it is optional, never required.
#
# The three domains left supported:false are argued per domain at the foot of
# ofs_catalog.yaml (the OFS file is the reasoned original; this one is derived)
# and summarised in one line above each entry below. Every reason is
# destination-level rather than field-level, so none of them closes by writing
# a field name here either. The loader refuses a supported reference entry
# whose dataset_key is unregistered or whose register's required fields go
# unpopulated, so LIMITS cannot be flipped on quietly.
#
# The reasons are COMMENTS rather than a `reason:` key because
# catalog.py::_parse_entry refuses any key outside _META_KEYS; giving the
# reason a parsed field (the market-data catalogs' `verification:` shape)
# needs that tuple widened, with a test, in the same change.

GL_BALANCES:
  supported: true
  endpoint: finance/v1.0.0/general-ledger/balances
  id_field: glCode
  selection:
    coCode: '{company}'
  page_size: 1000
  field_map:
    glCode: account_code
    description: name
    category: account_class
    currency: currency
    lcyBalance: balance
  attribute_keys:
  - balance_ghs
  lcy_fields:
    balance_ghs: lcyBalance
  enum_mappings:
    account_class:
      ASSET: ASSET
      LIABILITY: LIABILITY
      EQUITY: EQUITY
      INCOME: INCOME
      EXPENSE: EXPENSE
      CONTINGENT: OFF_BALANCE
POSITIONS_LOANS:
  supported: true
  endpoint: lending/v6.0.0/arrangements
  id_field: arrangementId
  selection:
    arrProductLine: LENDING
    coCode: '{company}'
  page_size: 500
  field_map:
    arrangementId: source_reference
    customer: counterparty_reference
    product: product_code
    currency: currency
    amount: balance
    startDate: origination_date
    maturityDate: contractual_maturity
    nextRepriceDate: next_repricing_date
    interestRate: interest_rate
    intType: rate_type
    indexRate: rate_index
    marginRate: rate_spread
    ifrs9Stage: ifrs9_stage
    coCode: branch_id
    arrStatus: arrears_status
  attribute_keys:
  - balance_ghs
  - ecl_provision_ghs
  - branch_id
  - arrears_status
  lcy_fields:
    balance_ghs: lcyAmount
    ecl_provision_ghs: lcyProvisionAmt
  enum_mappings:
    rate_type:
      F: FIXED
      V: FLOATING
      FIXED: FIXED
      FLOATING: FLOATING
    ifrs9_stage:
      '1': '1'
      '2': '2'
      '3': '3'
      STAGE1: '1'
      STAGE2: '2'
      STAGE3: '3'
  constants:
    position_type: LOAN
