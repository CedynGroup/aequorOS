# Unsupported: its DESTINATION does not exist. `limits` is not a registered
# reference dataset kind and no module consumes a limit utilisation figure; the
# loader would refuse this entry the moment it were flipped on. Closing it needs
# a `limits` dataset kind (migration), a consuming module, then the bank's own
# LIMIT.REFERENCE field names. Not closed by Phase 5 (2026-09-28).
LIMITS:
  supported: false
  endpoint: limits/v1.0.0/utilisation
  id_field: limitId
  selection:
    coCode: '{company}'
  field_map: {}
  dataset_key: limits
# Unsupported: the destination is the WRONG ONE, which no field map can fix.
# AA payment schedules are forward-looking contractual amounts per arrangement;
# `historical_cashflows` is a realised bank-level daily deposit inflow/outflow
# series that fact derivation sums and the cash-flow model trains on. Feeding
# schedules there would report loan repayments due as deposit inflows that
# happened. Closing it needs a dataset for contractual schedules, which has no
# register today. Not closed by Phase 5 (2026-09-28).
CASHFLOWS_SCHEDULED:
  supported: false
  endpoint: lending/v6.0.0/payment-schedules
  id_field: arrangementId
  selection:
    coCode: '{company}'
  field_map: {}
  dataset_key: historical_cashflows
# Unsupported: the destination needs CLASSIFICATION and AGGREGATION a rename
# cannot do. `historical_financials` wants a monthly P&L (net interest income,
# non-interest income, net income, operating expenses, provisions per period
# end); GL balance history is per-account and cumulative, so getting there needs
# the bank's own chart-of-accounts mapping and a monthly roll-up, and summing
# twelve cumulative balances double-counts. Closing it means shaping it in the
# extractor against a bank-supplied CoA register (as `gl_mapping_bsd7` is), not
# in `field_map`. Not closed by Phase 5 (2026-09-28).
HISTORICAL_BALANCES:
  supported: false
  endpoint: finance/v1.0.0/general-ledger/balance-history
  id_field: glCode
  selection:
    coCode: '{company}'
  field_map: {}
  dataset_key: historical_financials
