# ---------------------------------------------------------------------------
# Reference/other domains still staged, kept supported:false so the adapter
# never claims data it cannot yet extract. Reviewed 2026-09-28: all three stay
# open, and the reason differs per domain — none of them is a missing field
# name, so none of them closes by writing one.
#
# The loader now REFUSES a supported reference entry whose `dataset_key` is not
# a registered reference dataset kind, and one that does not populate the fields
# its register requires (catalog.py::_check_reference_destination). LIMITS
# therefore cannot be flipped to supported — here or through a bank's
# `catalog_overrides` — without that refusal naming it.
#
#   * LIMITS — its destination does not exist. `limits` is not a member of
#     REFERENCE_DATASET_KINDS, so ReferenceMapping refuses it (a raw Pydantic
#     error listing every internal dataset kind, raised while BUILDING a bank's
#     mapping config) and the canonical_reference_rows CHECK constraint refuses
#     it again. No module consumes a limit utilisation figure either. To close:
#     register a `limits` dataset kind with a migration, name the module that
#     reads it, then supply the LIMIT.REFERENCE field names — which the bank's
#     own T24 team must give, since AequorOS has no field-level documentation.
#   * CASHFLOWS_SCHEDULED — the destination is the WRONG ONE, which no field map
#     can fix. AA payment schedules are forward-looking contractual amounts per
#     arrangement; `historical_cashflows` is a realised bank-level daily deposit
#     inflow/outflow series (fact_derivation._derive_cashflow_summary sums the
#     last 90 days into facts, and app/ml/cashflow_history trains a per-tenant
#     forecast on it). Feeding schedules there would report loan repayments due
#     as deposit inflows that happened. To close: decide which dataset a
#     contractual schedule belongs in — there is no register for one today —
#     then map to that.
#   * HISTORICAL_BALANCES — `historical_financials` wants a monthly P&L
#     (period_end plus net_interest_income_ghs, non_interest_income_ghs,
#     net_income_ghs, operating_expenses_ghs, provisions_ghs). Getting there
#     from GL balance history needs the bank's own chart-of-accounts
#     classification and a monthly aggregation; `field_map` is a rename and can
#     do neither, and GL income balances are cumulative, so summing twelve of
#     them double-counts. To close: shape it in the extractor against a supplied
#     CoA mapping (the platform already treats that as a bank-supplied register
#     — see `gl_mapping_bsd7`), not in a field_map.
# ---------------------------------------------------------------------------

LIMITS:
  supported: false
  application: LIMIT.REFERENCE
  enquiry: AEQ.LIMIT.UTILISATION
  id_field: LIMIT.ID
  selection:
    CO.CODE: "{company}"
