# Temenos T24 — OFS connection-mode catalog.
#
# Maps each CoreBankingDomain to its OFS request coordinates (T24 application +
# ENQUIRY.SELECT enquiry) and to the canonical output schema the OFS extractors
# emit. `field_map` renames raw T24 fields to canonical keys; `attribute_keys`
# marks canonical keys copied into the position/account `attributes` payload
# (and each MUST be sourced from a field_map target, an lcy_field, or a
# constant); `lcy_fields` binds a canonical attribute to the T24 local-currency-
# equivalent field; `enum_mappings`/`constants` finish canonicalization.
#
# HONESTY RAILS:
#   * A domain without `supported: true` is NOT offered (never fake support).
#   * Enquiry names below are AequorOS-convention DEFAULTS. T24 enquiries are
#     installation-specific — a bank overrides them via connection
#     `catalog_overrides` without a code change. The loader validates structure,
#     not that a given enquiry exists in a particular core.
#   * Application/field names stay within documented, standard T24 vocabulary
#     (KNOWN_TABLES in adapter.py); nothing here invents a T24 endpoint.
#   * docs/data_engine.md §9 documents T24 TABLE names and not one field name,
#     and forbids inventing more (lines 620, 630, 1045, 1063). So a field name
#     may only be ADDED to a field_map where the identifier is already present
#     in this repository — in the same entry's own `selection`, in a sibling
#     domain's field_map, or in the adapter's fixtures — and a reviewer can
#     check the addition without a Temenos portal account. `CO.CODE: branch_id`
#     on the money-market and securities entries (added 2026-09-28) is exactly
#     that: the field is already this entry's selection key, POSITIONS_LOANS /
#     _DEPOSITS / _CURRENT_ACCOUNTS already map it to `branch_id`, and the
#     fixtures for all three domains carry it. It lands
#     `attributes.branch_id`, matched against `business_units.business_unit_id`
#     (BUSINESS_UNITS below maps COMPANY.CODE to it), which is what the BI
#     branch dimension and fact_derivation._business_unit_names resolve. An
#     enquiry that does not return the field simply leaves it unpopulated.

# ---------------------------------------------------------------------------
# Priority domains — the pilotable core (supported now).
# ---------------------------------------------------------------------------

GL_BALANCES:
  supported: true
  application: GENERAL.LEDGER
  enquiry: AEQ.NOFILE.GL.BALANCES
  id_field: GL.CODE
  page_size: 1000
  selection:
    CO.CODE: "{company}"
  field_map:
    GL.CODE: account_code
    DESCRIPTION: name
    CATEGORY: account_class
    CURRENCY: currency
    LCY.BALANCE: balance
  attribute_keys:
    - balance_ghs
  lcy_fields:
    balance_ghs: LCY.BALANCE
  enum_mappings:
    account_class:
      ASSET: ASSET
      LIABILITY: LIABILITY
      EQUITY: EQUITY
      INCOME: INCOME
      EXPENSE: EXPENSE
      CONTINGENT: OFF_BALANCE
  constants: {}

