    - branch_id
    - arrears_status
  lcy_fields:
    balance_ghs: LCY.AMOUNT
    ecl_provision_ghs: LCY.PROVISION.AMT
  enum_mappings:
    rate_type:
      F: FIXED
      V: FLOATING
      FIXED: FIXED
      FLOATING: FLOATING
    ifrs9_stage:
      "1": "1"
      "2": "2"
      "3": "3"
      STAGE1: "1"
      STAGE2: "2"
      STAGE3: "3"
  constants:
