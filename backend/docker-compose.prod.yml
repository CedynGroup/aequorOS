# =============================================================================
# AequorOS risk service — PRODUCTION compose (Coolify: Base Directory /backend,
# Docker Compose Location /docker-compose.prod.yml).
#
# Production grade rules enforced here:
#   · NO bundled database or object store — production uses the managed
#     Postgres (DATABASE_URL) and the existing MinIO/S3 (S3_*). The bundled
#     risk-postgres/risk-minio in docker-compose.yml are LOCAL DEV ONLY.
#   · NO credentials in this file, and NO variable interpolation either: every
#     service loads `env_file: .env` — the file the platform (Coolify) writes
#     from its Environment Variables UI into the project directory. SHARP EDGE
#     (learned 2026-07-21): Coolify PARSES compose files — including comments —
#     and auto-seeds a UI env row for every dollar-brace variable reference it
#     finds; with required-with-message guards it even stored the message text
#     as the value, and its duplicate handling re-injected junk rows on every
#     deploy. Referencing no variables gives the parser nothing to seed. Do
#     not reintroduce dollar-brace interpolation in this file, even in comments.
#   · Fail-fast moved to the app layer: the backend refuses to start on missing
#     critical config (empty DATABASE_URL → settings validator raises in
#     risk-migrate; unset AUTH_JWT_SECRET → auth fails closed), so a bad value
#     still stops the deploy at the migrate step.
#
# Coolify domains: attach api.aequoros.com to risk-api ONLY (container port
# 8000). risk-migrate, risk-worker and risk-worker-bi get no domain.
# =============================================================================

services:
  # One-shot: bring the managed database schema to head before api/worker start.
  risk-migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file:
      - .env

  risk-api:
    build: .
    restart: unless-stopped
    depends_on:
      risk-migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    # /health/ready, NOT /health/live: liveness answers "is the process
    # responding", which stays true of an API whose object store rejects every
    # key and whose worker cannot claim a single job — the deploy went green on
    # exactly that (audit findings P0-16, P0-17). Readiness probes the database,
    # performs a real object-store round trip, and reports whether the worker can
    # see the job queue. Timeouts are generous because it now does real I/O.
    # Compose healthchecks gate deploys and report status; they do not restart
    # containers, so a dependency outage marks this unhealthy without putting it
    # into a restart loop.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=8).status==200 else 1)\""]
      interval: 30s
      timeout: 12s
      retries: 5
      start_period: 45s
    env_file:
      - .env
    environment:
      # Literal pin (overrides env_file): workers run as a separate service;
      # never in-process in prod.
      RUN_INPROCESS_WORKER: "0"

  risk-worker:
    build: .
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    # Long handlers (etl_dedup runs >15 min): give SIGTERM time to finish the
    # in-flight job before the reaper/retry machinery has to clean up.
    stop_grace_period: 120s
    depends_on:
      risk-migrate:
        condition: service_completed_successfully
    # The worker had no healthcheck at all, and its worst failure is silent:
    # `jobs` is FORCE-RLS and the claim query runs with no tenant set, so a role
    # without BYPASSRLS matches zero rows for every tenant forever — no error, no
    # log, and a process that looks perfectly alive while every scheduled
    # refresh, official run and vendor pull stops (audit finding P0-16). This
    # asserts the role can claim AND that the poll loop wrote a heartbeat within
    # WORKER_STALE_JOB_SECONDS.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from app.worker import healthcheck; healthcheck()\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    env_file:
      - .env
    environment:
      # Literal pin: this worker runs the CORE lane only. It is also the
      # default, and it is pinned anyway so the one process that must never
      # hold a model credential says so in the file a reader opens first.
      # The AI lane is a SEPARATE Coolify app (docker-compose.ai.prod.yml).
      WORKER_JOB_TYPES: "lane:core"
      WORKER_ID: "risk-worker"

  # The BI mart worker: the ONLY process that claims the bi lane — seven job
  # types per job_queue.JOB_LANES: bi_mart_refresh, bi_mart_backfill,
  # bi_retention, bi_export, bi_alert_evaluate, bi_subscription_scan,
  # bi_subscription_run (bi_commentary and bi_nlq_translate are AI-lane types
  # and run in docker-compose.ai.prod.yml, never here). It lives in this file
  # rather than its own Coolify app because it needs no secret the others lack
  # — the AI worker is separate to isolate a credential; this one is separate
  # to keep heavy mart builds out of the core worker's FIFO and out of the API.
  #
  # DEPLOY ORDER (D-008): this service must be running and healthy BEFORE
  # BI_MART_ENQUEUE_ENABLED or BI_SCHEDULER_ENABLED is set in the shared .env.
  # The API and every worker poll one jobs table; a BI job enqueued while no
  # bi-lane process exists sits queued forever (the notification_email_mirror
  # orphan). Both flags ship off, so adding this service to a release is safe
  # on its own; flipping a flag is a separate, later act.
  risk-worker-bi:
    build: .
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    # Must exceed one backfill hop: a hop builds dates for BI_BACKFILL_HOP_SECONDS
    # (default 600 s) and the date in flight when the budget expires runs to
    # completion. SIGTERM inside a hop loses at most that hop, but giving it
    # room to finish avoids the reclaim window entirely. Keep this in step with
    # the hop setting.
    stop_grace_period: 900s
    depends_on:
      risk-migrate:
        condition: service_completed_successfully
    # Same two-question probe as risk-worker: can this role claim at all, and
    # has THIS worker's poll loop written a heartbeat recently. WORKER_ID is
    # pinned below so the check reads its own heartbeat rather than a peer's.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from app.worker import healthcheck; healthcheck()\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    env_file:
      - .env
    environment:
      # Literal pins (these override env_file). The lane selection is what
      # makes this the only process that claims BI jobs; the core worker and
      # the API's in-process thread never select the bi lane.
      WORKER_JOB_TYPES: "lane:bi"
      WORKER_ID: "risk-worker-bi"
      RUN_INPROCESS_WORKER: "0"

  # Staff control plane (operator API): the app behind console.aequoros.com.
  # Same image, third entrypoint (api/worker/operator). Attach a dedicated
  # domain to container port 8100 (e.g. op.aequoros.com); the console app's
  # OPERATOR_API_URL points at it. Auth is workforce-OIDC-only in production
  # (dev auth is hard-refused), and OPERATOR_DATABASE_URL falls back to
  # WORKER_DATABASE_URL from the shared .env when unset.
  risk-operator:
    build: .
    command: ["uvicorn", "app.operator.main:app", "--host", "0.0.0.0", "--port", "8100"]
    restart: unless-stopped
    depends_on:
      risk-migrate:
        condition: service_completed_successfully
    expose:
      - "8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/operator/health', timeout=4).status==200 else 1)\""]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    env_file:
      - .env
