<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Primary navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Primary" style="box-sizing: border-box; width: 100%; min-height: 100%; background: #0F1E36; color: #DCE4F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px; padding: 22px 14px 24px">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 6px">
<div aria-label="Regulator mark placeholder" role="img" style="flex: 0 0 auto; width: 40px; height: 40px; border-radius: 8px; border: 1.5px dashed #6F84A6; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; letter-spacing: 0.06em; color: #A9B7CC">MARK</div>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 14px; font-weight: 600; color: #FFFFFF; line-height: 1.2">AequorOS Reporting Gateway</span>
<span style="font-size: 12px; color: #A9B7CC">Banking Supervision</span>
</div>
</div>
<sc-for list="{{groups}}" as="group" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A9B7CC; padding: 0 10px 6px">{{group.label}}</span>
<sc-for list="{{group.items}}" as="item" hint-placeholder-count="4">
<a href="{{item.href}}" aria-current="{{item.current}}" style="{{item.style}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
<span style="flex: 1 1 auto">{{item.label}}</span>
<sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{false}}">
<span style="font-size: 12px; font-weight: 600; background: #2B4672; color: #FFFFFF; border-radius: 999px; padding: 1px 8px">{{item.badge}}</span>
</sc-if>
</a>
</sc-for>
</div>
</sc-for>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 12px; color: #FFD9A8; background: #3A2E1A; border-radius: 6px; padding: 8px 10px; line-height: 1.4">Concept design · synthetic data</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; background: #16294A">
<div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 999px; background: #2B4672; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">KO</div>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 13px; font-weight: 600; color: #FFFFFF">Kofi Owusu</span>
<span style="font-size: 12px; color: #A9B7CC">Senior Supervisor</span>
</div>
</div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","inbox","queries","calendar","institutions","returns","onboarding","audit","access"],"default":"overview"},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'overview';
    const base = 'display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px; border-radius: 8px; font-size: 14px; text-decoration: none; ';
    const groups = [
      { label: 'Supervision', items: [
        { key: 'overview', label: 'Overview', href: 'Main.dc.html', icon: 'M4 4h7v7H4z M13 4h7v4h-7z M13 10h7v10h-7z M4 13h7v7H4z' },
        { key: 'inbox', label: 'Submissions', href: 'Inbox.dc.html', badge: '18', icon: 'M4 13l2.5-8h11L20 13 M4 13v6h16v-6 M4 13h5l1 2h4l1-2h5' },
        { key: 'queries', label: 'Queries', href: 'Queries.dc.html', badge: '7', icon: 'M5 5h14v10H9l-4 4z' },
        { key: 'calendar', label: 'Filing calendar', href: 'Calendar.dc.html', icon: 'M5 6h14v14H5z M5 10h14 M9 4v4 M15 4v4' },
        { key: 'institutions', label: 'Institutions', href: 'Institution.dc.html', icon: 'M4 10l8-5 8 5 M6 10v8 M10 10v8 M14 10v8 M18 10v8 M4 20h16' }
      ] },
      { label: 'Configuration', items: [
        { key: 'returns', label: 'Return definitions', href: 'Returns.dc.html', icon: 'M7 4h7l4 4v12H7z M14 4v4h4 M9.5 13h5 M9.5 16h5' },
        { key: 'onboarding', label: 'Channel register', href: 'Onboarding.dc.html', icon: 'M15 4a5 5 0 1 0 0 10 5 5 0 0 0 0-10z M11.5 12.5L4 20 M7 17l2 2' }
      ] },
      { label: 'Assurance', items: [
        { key: 'audit', label: 'Audit log', href: 'Audit.dc.html', icon: 'M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z M9 12l2 2 4-4' },
        { key: 'access', label: 'Access & approvals', href: 'Access.dc.html', icon: 'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M3 19c0-3 2.7-5 6-5s6 2 6 5 M16 6a3 3 0 0 1 0 5 M17 14c2.3.4 4 2.2 4 5' }
      ] }
    ];
    return {
      groups: groups.map((group) => ({
        label: group.label,
        items: group.items.map((item) => {
          const on = item.key === active;
          return {
            ...item,
            hasBadge: Boolean(item.badge),
            current: on ? 'page' : 'false',
            style: base + (on ? 'background: #24406B; color: #FFFFFF; font-weight: 600' : 'color: #DCE4F0; font-weight: 500')
          };
        })
      }))
    };
  }
}
</script>
</body>
</html>
