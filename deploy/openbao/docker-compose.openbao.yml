# =============================================================================
# OpenBao — the signing key store and certificate authority for attestation.
#
# Runs on its OWN host, not beside the API. That separation is the point: if the
# application VPS is compromised (it terminates public traffic, so it is the more
# exposed surface) the attacker holds an AppRole token with a scoped policy, not
# key material. They can ask OpenBao to sign, which is loud and auditable, rather
# than walking off with a key.
#
# OpenBao is the Linux Foundation fork of HashiCorp Vault, taken from the last
# MPL-2.0 release. The licence is why it is here rather than Vault: BUSL restricts
# offering the software as a competing service, which is a question a commercial
# product should not have to answer for every bank's procurement review.
#
# Coolify: Base Directory /deploy/openbao, Compose Location
# /docker-compose.openbao.yml.
#
# -----------------------------------------------------------------------------
# THE CONFIG IS INLINE, AND THAT IS NOT A STYLE CHOICE.
#
# Coolify's Docker Compose build pack materialises ONLY the compose file on the
# deployment host. The repository is not checked out there — that is what the
# "Preserve Repository During Deployment" toggle controls, and it is off by
# default — so `- ./openbao.hcl:/openbao/config/openbao.hcl` has no source to
# bind. Docker's default is then to CREATE the missing source as an empty
# DIRECTORY. OpenBao reads a directory as a config *directory*, finds no .hcl in
# it, and exits with "a storage backend must be specified" — a message pointing
# nowhere near the cause. It restart-loops, and the directory Docker created then
# BLOCKS any corrected checkout from writing the real file, so fixing the path
# alone cannot recover it. That cost two production deploys on 2026-07-26 and
# needed an rmdir on the host between attempts.
#
# The obvious guard does not survive either: `create_host_path: false` in the long
# bind syntax makes Docker refuse rather than invent a directory, but Coolify
# NORMALISES the compose and rewrites long-syntax mounts to short form, silently
# dropping that option (and `read_only` with it). Confirmed by reading the
# generated docker-compose.yaml on the host.
#
# So the config travels inside the one artifact Coolify is guaranteed to
# materialise: this file. Nothing here depends on a second file existing anywhere.
#
# NO variable interpolation anywhere, comments included — Coolify parses compose
# text and auto-seeds a UI environment row for every dollar-brace reference it
# finds (the 2026-07-21 incident stored guard message text AS VALUES and
# re-injected duplicate rows on every deploy).
#
# Deployment, initialisation, unseal and backup: docs/openbao-deployment.md.
# Nothing here initialises or unseals — both are deliberate human acts, because
# the unseal shares must never live on the host they unseal.
# =============================================================================

services:
  openbao:
    # Pinned, never "latest": an unattended major upgrade of the store that holds
    # every signing key is not a thing to discover after a restart.
    image: openbao/openbao:2.6.1
    restart: unless-stopped
    # Three things in the config below are load-bearing and were each learned by
    # running the real image rather than by writing plausible HCL:
    #
    # · No `disable_mlock`. OpenBao 2.x dropped mlock support entirely and
    #   REFUSES TO START if the setting appears at all. Keeping key material out
    #   of swap is now the host's job — disable or encrypt swap, which the runbook
    #   covers and which is not optional.
    # · Storage at /openbao/file, not /openbao/data. The image runs as uid 100 and
    #   ships /openbao/{config,file,logs} owned by that user, but no
    #   /openbao/data — a named volume mounted at a path the image does not
    #   contain is created root-owned, and the server dies on first boot with
    #   "permission denied" opening the bolt file.
    # · Raft rather than the file backend even for one node: adding the second and
    #   third node later is then a join rather than a storage migration, and
    #   signing SHOULD be highly available before a bank depends on it (DBK is due
    #   10:00 T+1, five days a week).
    command:
      - sh
      - -c
      - |
        cat > /openbao/config/openbao.hcl <<'HCL'
        storage "raft" {
          path    = "/openbao/file"
          node_id = "openbao-1"
        }

        # TLS terminates at the reverse proxy on this host, so the listener is
        # plaintext on the container network only. Two conditions come with that:
        # the proxy MUST be on this host, and 8200/8201 MUST NOT be published.
        # The application then reaches OpenBao over HTTPS at its public hostname
        # with a public certificate, so there is no OPENBAO_CA_CERT to configure
        # — and that path has never been exercised against a real private CA.
        listener "tcp" {
          address     = "0.0.0.0:8200"
          tls_disable = true
        }

        # Both must be the address OTHER parties use, not the container's own.
        # api_addr is what the PKI engine stamps into every certificate's CRL and
        # OCSP URLs — get it wrong and an external validator cannot fetch the
        # revocation list for a filed return, years after the fact.
        api_addr     = "https://bao.aequoros.com"
        cluster_addr = "https://bao.aequoros.com:8201"

        ui = false

        # Audit devices are enabled AFTER initialisation, never here: an audit
        # device that cannot write makes OpenBao refuse every request, including
        # the ones needed to fix it.
        HCL
        exec bao server -config=/openbao/config/openbao.hcl
    volumes:
      - openbao-data:/openbao/file
    expose:
      - "8200"
    # Liveness, deliberately NOT readiness. `sealedcode=200&uninitcode=200` makes
    # a sealed or uninitialised server report healthy, because both are states a
    # human resolves rather than container failures — and an unhealthy container
    # gets restarted, which would make it impossible to ever unseal. Every fresh
    # deploy starts sealed, so the naive check (`bao status`, which exits
    # non-zero while sealed) deadlocks the first deploy.
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      # Literal, not a variable reference. The `bao` CLI defaults to HTTPS, which
      # the healthcheck and every `docker exec … bao` would fail against a
      # plaintext listener. This is the only value the service needs from the
      # environment, so it takes NO .env file.
      BAO_ADDR: "http://127.0.0.1:8200"

volumes:
  openbao-data:
